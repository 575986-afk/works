<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>로그인</title>
<link rel="stylesheet" th:href="@{/common/css/login.css}" />
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'맑은 고딕', sans-serif;
}

body{
    background:#f3f3f3;
}

/* 상단 헤더 (공통 분리용) */
header{
    width:100%;
    height:60px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding-left:30px;
}
/*
 .header-logo {
    width: 20px;
    height: 20px;
    background-color: #00c6c9;
    border-radius: 3px;
    margin-right: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 10px;
    font-weight: 800;
} */

/* 가운데 */
.container{
    width:100%;
    display:flex;
    justify-content:center;
    margin-top:100px;
}

.login-box{
    width:550px;
    height:600px;
    background:white;
    border-radius:10px;
    padding:35px 30px;
    padding-left:50px; 
	padding-right:50px; 
}

.login-box h2{
	height:100px;
	padding-top:70px; 
    font-size:24px;
    margin-bottom:35px;
    font-weight:bold;
}

.input-box{
    margin-bottom:12px;
}

.input-box input{
    width:100%;
    height:45px;
    border:1px solid #ddd;
    border-radius:4px;
    padding-left:15px;
    font-size:14px;
}

.save-id{
    margin-top:8px;
    margin-bottom:25px;
    font-size:13px;
}

.login-btn{
    width:100%;
    height:46px;
    background:#1f7ef2;
    color:white;
    border:none;
    border-radius:4px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.login-btn:hover{
    background:#1768c8;
}

.bottom-menu{
    margin-top:35px;
    display:flex;
    justify-content:space-between;
    font-size:13px;
}

.bottom-signupChk a,
.bottom-findIdPw a {
    text-decoration: none;
    color: #555;
}

.bottom-signupChk a:hover,
.bottom-findIdPw a:hover {
    color: #1f7ef2;
}
</style>

</head>

<body>

<!-- 헤더 프래그먼트 적용 -->
<div th:replace="~{fragments/loginHeader :: commonHeader}"></div>

<div class="container">

    <div class="login-box">

        <h2>로그인</h2>
			
        <form th:action="@{/loginProcess}" method="post">

            <div class="input-box">
                <input type="text" name="id" th:value="${saveId}" placeholder="아이디를 입력해 주십시오.">
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="비밀번호를 입력해 주십시오.">
            </div>

            <div class="save-id">
                <input type="checkbox" id="saveId" name="saveId" th:checked="${saveId != null}">
                <label for="saveId">아이디 저장</label>
            </div>

            <button class="login-btn" type="submit">
                로그인
            </button>

        </form>

        <div class="bottom-menu">
            <div class="bottom-signupChk"><a th:href="@{/signupChk}">회원 가입</a></div>

            <div class="bottom-findIdPw">
                <a th:href="@{/findId}">아이디 찾기</a>
                &nbsp;&nbsp;&nbsp;
                <a th:href="@{/findPw}">비밀번호 찾기</a>
            </div>
        </div>

    </div>

</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var loginMsg = /*[[${loginMsg}]]*/ null;
    if (loginMsg) {
        alert(loginMsg);
    }
    var signupMsg = /*[[${signupMsg}]]*/ null;
    if (signupMsg) {
        alert(signupMsg);
    }
    
</script>
      <script th:inline="javascript">
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            alert("비밀번호가 변경되었습니다. 다시 로그인해 주세요.");
        }
    };
</script>
