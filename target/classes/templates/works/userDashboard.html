<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="UTF-8">
<title>WORKS 홈</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" th:href="@{/common/css/address.css}">
<style>
:root{
    --bg:#f8fafc;
    --card:#ffffff;
    --text:#1e293b;
    --sub:#64748b;
    --border:#e2e8f0;
    --blue:#2563eb;
    --mint:#0f9d8b;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;
}

body{
    background:var(--bg);
}

.container{
    width:100%;
    max-width:1150px;
    margin:100px auto 50px;
    padding:0 20px;
    display:flex;
    gap:24px;
    align-items: flex-start;
    justify-content: center;
}

.home-card{
    flex:1;
    min-height:430px;
    min-width:400px;
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px;
    box-shadow: 0 4px 12px rgba(15,23,42,0.04);
    transition: box-shadow .25s ease; 
}

.home-card:hover{
    box-shadow: 0 12px 30px rgba(15,23,42,0.08);
}

.card-todo {
    min-height: 550px;
    min-width: 400px;
}

.profile-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

.profile-avatar{
    width:72px;
    height:72px;
    border-radius:50%;
    background:#2E77E0;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:26px;
    font-weight:bold;
    margin-bottom:18px;
}

.profile-greeting{
    font-size:19px;
    font-weight:700;
    color:var(--text);
    line-height:1.5;
}

.profile-team{
    margin-top:8px;
    color:var(--sub);
    font-size:14px;
}

.profile-status{
    margin-top:14px;
    padding:5px 12px;
    border-radius:20px;
    background:#ecfdf5;
    color:#059669;
    font-size:12px;
    font-weight:600;
}

.profile-date{
    margin-top:14px;
    font-size:12px;
    color:var(--sub);
    display: flex;        
    align-items: center;   
    gap: 6px;             
}

.profile-buttons{
    margin-top:40px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.profile-btn{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:white;
    color:var(--text);
    font-size:14px;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.profile-btn:hover{
    background:#f8fafc;
}

.card-header-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.card-title-group{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:17px;
    font-weight:700;
    color:var(--text);
}

.card-action-icon{
    color:#94a3b8;
}

/* ======================
 할일 리스트 영역 스타일
====================== */
.todo-list-container {
    margin-top: 10px;
    max-height: 400px;
    overflow-y: auto;
}

.todo-item {
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #f8fafc;
    font-size: 14px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.empty-content{
    height: 380px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:12px;
    color:#94a3b8;
    font-size:14px;
}

.empty-icon{
    width:42px;
    height:42px;
    opacity:.35;
}

.org-info{
    margin-top:25px;
    padding:18px;
    border-radius:12px;
    background:#f8fafc;
    font-size:14px;
    color:var(--sub);
}

.org-info strong{
    display:block;
    color:var(--text);
    margin-bottom:8px;
}

.btn-full{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--blue);
    color:white;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    margin-top:25px;
}

.btn-full:hover{
    background:#1d4ed8;
}
</style>
</head>
<body>

<!-- <div th:replace="~{fragments/header :: commonHeader}"></div> -->
<div th:replace="~{fragments/dashboardHeader :: user-header}"></div>

<div class="container">

    <div class="home-card">
        <div class="profile-top">
            <div class="profile-avatar">
                <span th:text="${#strings.substring(userName, 0, 1)}"></span>
            </div>

            <div class="profile-greeting">
                <span th:text="${userName}"></span> 님, <br>
                안녕하세요.
            </div>

            <div class="profile-team">
                <span id="rank" th:text="${rank}"></span>/<span id="position" th:text="${position}"></span>
            </div>

            <div class="profile-status" th:text="${currentStatusName != null && currentStatusName != ''} ? '● ' + ${currentStatusName} : ''"></div>

            <div class="profile-date">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span id="currentDate"></span>
            </div>
        </div>

        <div class="profile-buttons">
            <a href="/statusSetting">
                <button class="profile-btn">⚙ 상태 설정</button>
            </a>
            
            <button class="profile-btn" id="alarmToggleBtn" th:onclick="'toggleAlarm(' + ${isAlarmOn} + ')'">
                <span id="alarmIcon" th:text="${isAlarmOn == 1} ? '🔕' : '🔔'">🔕</span>
                <span id="alarmText" th:text="${isAlarmOn == 1} ? '알람 일시 정지' : '알람 켜기'">알람 일시 정지</span>
            </button>
        </div>
    </div>

    <div class="home-card card-todo">
        <div class="card-header-row">
            <div class="card-title-group">
                <span>할 일</span>
                <span class="card-action-icon">></span>
            </div>
            <span style="color:#2563eb;">✓</span>
        </div>

        <div class="todo-list-container" th:if="${not #lists.isEmpty(todoList)}">
            <div class="todo-item" th:each="todo : ${todoList}">
                <span th:text="${todo.content}">할일 내용</span>
            </div>
        </div>

        <div class="empty-content" th:if="${#lists.isEmpty(todoList)}">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>등록된 할 일이 없습니다.</span>
        </div>
    </div>
    
    
    <div class="home-card">
        <div class="card-header-row">
            <div class="card-title-group">
                <span>조직도 </span>
                <span class="card-action-icon">></span>
            </div>
            <span style="color:#2563eb;">👥</span>
        </div>

        <div class="todo-list-container" th:if="${not #lists.isEmpty(organizationList)}">
            <div class="todo-item" th:each="organization : ${organizationList}">
                <span th:text="${organization.organization_name}">조직도 이름 </span><br>
                <span th:text="${organization.organization_description}">조직도 내용</span>
            </div>
        </div>

        <div class="empty-content" th:if="${#lists.isEmpty(organizationList)}">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>등록된 조직도가 없습니다.</span>
        </div>
    </div>

</div>

<script th:if="${loginMsg}">
    alert('[[${loginMsg}]]');
</script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script th:inline="javascript">
    $(document).ready(function() {
        let now = new Date();
        let year = now.getFullYear();
        let month = now.getMonth() + 1;
        let date = now.getDate();
        $("#currentDate").text(year + "년 " + month + "월 " + date + "일");
    });

    function toggleAlarm(currentStatus) {
        let newAlarmStatus = (currentStatus === 1) ? 0 : 1;

        $.ajax({
            url: '/AlarmSetting',
            type: 'POST',
            data: { isAlarmOn: newAlarmStatus },
            success: function(response) {
                if (response > 0) {
                    location.reload();
                } else {
                    alert("알람 설정 변경에 실패했습니다.");
                }
            },
            error: function() {
                alert("서버 통신 오류가 발생했습니다.");
            }
        });
    }
</script>
</body>
</html>
