<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메신저</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;
        }

        body {
            background-color: #f5f6f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 60px;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            width: 100%;
        }

        .sidebar {
            width: 320px;
            background-color: #ffffff;
            border-right: 1px solid #dddddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .btn-create {
            background-color: #2E77E0;
            color: white;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .sidebar-sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
        }

        .room-item {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f9f9f9;
            position: relative;
        }

        .room-item:hover {
            background-color: #f7f9fc;
        }

        .room-item.active {
            background-color: #ebf5ee;
        }

        .room-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2E77E0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .room-info {
            flex: 1;
            min-width: 0;
        }

        .room-info-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .room-name {
            font-size: 14px;
            font-weight: bold;
            color: #111;
        }

        .room-time {
            font-size: 11px;
            color: #888;
        }

        .room-preview {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            border-radius: 10px;
            padding: 2px 6px;
            position: absolute;
            right: 16px;
            bottom: 12px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .chat-header {
            height: 52px;
            border-bottom: 1px solid #dddddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .chat-room-title {
            font-size: 15px;
            font-weight: bold;
            color: #111;
        }

        .chat-room-title span {
            font-size: 12px;
            color: #888;
            margin-left: 6px;
            font-weight: normal;
        }

        .chat-options {
            font-size: 18px;
            color: #555;
            cursor: pointer;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        .date-divider {
            font-size: 12px;
            color: #888;
            background-color: #f1f3f5;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .system-message {
            font-size: 13px;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        .chat-input-area {
            border-top: 1px solid #dddddd;
            padding: 12px 16px;
            background-color: #ffffff;
        }

        .chat-input-box {
            background-color: #f8f9fa;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-box textarea {
            border: none;
            background: transparent;
            outline: none;
            resize: none;
            height: 40px;
            font-size: 13px;
        }

        .chat-input-actions {
            display: flex;
            gap: 12px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header style="width: 100%; height: 60px; background: white; border-bottom: 1px solid #dddddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; box-sizing: border-box;">
         <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 20px; height: 20px; background-color: #2E77E0; border-radius: 3px; display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: 800;">W</div>
   			 <a th:href="@{/userDashboard}" style="display: flex; align-items: center; gap: 6px; color: #333333; font-size: 14px; font-weight: 600; text-decoration: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f7ef2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>메시지</span>
       		 </a>
        </div> 

        <div style="flex: 0 1 340px; position: relative; margin: 0 20px;">
            <form th:action="@{/search}" method="get" style="display: flex; align-items: center; width: 100%;">
                <div style="background-color: #f1f3f5; border-radius: 4px; padding: 6px 12px 6px 32px; display: flex; align-items: center; width: 100%; position: relative;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%);">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" name="keyword" placeholder="메시지 검색" style="border: none; background: transparent; outline: none; font-size: 13px; width: 100%; color: #333;">
                </div>
            </form>
        </div>

        <div style="display: flex; align-items: center; gap: 16px;">
            <a href="/userInfo" title="설정" style="color: #666666; text-decoration: none;">⚙️</a>
        </div>
    </header>

    <div class="main-container">
        
        <!-- 좌측 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="btn-create">새로 만들기</button>
            </div>
            <div class="sidebar-sub-header">
                <span>메시지방</span>
                <span>⇅</span>
            </div>
            
            <div class="room-list">
                <div class="room-item" 
			     th:each="room : ${chatRoomList}" 
			     th:classappend="${room.chatRoomNo !=null} ? 'active'"
			     th:onclick="|location.href='@{/chatting(chatRoomNo=${room.chatRoomNo})}'|">
			    
			    <div class="room-avatar" th:text="${#strings.substring(room.chatRoomName, 0, 1)}"></div>
			    
			    <div class="room-info">
			        <div class="room-info-top">
			            <span class="room-name" th:text="${room.chatRoomName}"></span>
			        </div>
			        <div class="room-preview" th:text="${room.lastMessage}"></div>
			            <span class="room-time" th:text="${room.lastTime}"></span>
			    </div>
			    
			</div>
            </div>
        </aside>

        <!-- 우측 대화창 -->
        <main class="chat-area">
            <div class="chat-header">
                <div class="chat-room-title">
                    <span th:text="${currentRoomName}">채팅방</span>
                </div>
                <div class="chat-options">⋮</div>
            </div>

            <div class="chat-body">
                <div class="date-divider" th:text="${currentDate}">2026. 8. 21. (금)</div>
                <div class="system-message">
                    대화 내용이 없습니다.<br>메시지를 입력해 보세요.
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-box">
                    <textarea placeholder="메시지를 입력하세요..."></textarea>
                    <div class="chat-input-actions">
                        <span>➕</span>
                        <span>🔗</span>
                        <span>📊</span>
                    </div>
                </div>
            </div>
        </main>

    </div>
</body>
</html>
