<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<style type="text/css">
.cal-edit-card { padding: 24px; background: #fff; border-radius: 12px; }
.top-btn-group { display: flex; gap: 8px; margin-bottom: 20px; }

.btn-save-custom {
    background-color: #186ade;
    border: none;
    color: #fff;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
}
.btn-save-custom:hover { background-color: #1153b3; }

.btn-outline-custom {
    background-color: #fff;
    border: 1px solid #d9d9d9;
    color: #333;
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
}
.btn-outline-custom:hover { background-color: #f5f5f5; }

.form-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.form-icon { width: 20px; text-align: center; color: #666; font-size: 15px; padding-top: 8px; }

.input-custom {
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    color: #333;
    outline: none;
}
.input-custom:focus { border-color: #186ade; }
.title-input { width: 100%; font-size: 14px; }

.datetime-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }

.green-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    background-color: #28a745;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
}
.fixed-company-text {
    font-size: 14px;
    color: #333;
    padding-top: 6px;
    display: flex;
    align-items: center;
}

.sub-caption { font-size: 12px; color: #8c8c8c; margin-top: 6px; }
.edit-divider { border: 0; height: 1px; background: #f0f0f0; margin: 18px 0; }

.textarea-custom {
    width: 100%;
    height: 85px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 10px;
    font-size: 13px;
    resize: none;
    outline: none;
}
.meta-info { font-size: 12px; color: #8c8c8c; line-height: 1.8; }
</style>

<script type="text/javascript">
function deleteCalendar() {
    if (confirm("일정을 삭제하시겠습니까?")) {
        document.getElementById("deleteFormInEdit").submit();
    }
}
</script>
</head>
<body>

<div class="cal-edit-card">
    <form th:action="@{/adminUser/service/calendar/modifyCal}" method="post" id="modifyForm">
        <!-- 백엔드 DTO 매핑을 위해 calenderNo로 통일 -->
        <input type="hidden" name="calenderNo" th:value="${calendar.calenderNo}" />

        <div class="top-btn-group">
            <button type="submit" class="btn-save-custom">저장</button>
            
            <button type="button" 
                    class="btn-outline-custom" 
                    th:onclick="goDetail([[${calendar.calenderNo}]])">취소</button>
                    
            <button type="button" class="btn-outline-custom" onclick="deleteCalendar()" style="margin-left: 6px;">일정 삭제</button>
        </div>

        <!-- 제목 -->
        <div class="form-row">
            <div class="form-icon"><i class="fa-regular fa-star"></i></div>
            <div style="flex: 1;">
                <input type="text" name="title" class="input-custom title-input" th:value="${calendar.title}" required />
            </div>
        </div>

        <!-- 시작/종료 날짜 및 시간 (standard HTML5 type 사용) -->
        <div class="form-row">
            <div class="form-icon"><i class="fa-regular fa-clock"></i></div>
            <div class="datetime-group">
                <input type="date" name="startDate" class="input-custom" th:value="${calendar.startDate}" required />
                <input type="time" name="startTime" class="input-custom" th:value="${calendar.startTime}" required />
                <span>-</span>
                <input type="date" name="endDate" class="input-custom" th:value="${calendar.endDate}" required />
                <input type="time" name="endTime" class="input-custom" th:value="${calendar.endTime}" required />
            </div>
        </div>

        <!-- 회사 정보 -->
        <div class="form-row">
            <div class="form-icon"><i class="fa-regular fa-calendar"></i></div>
            <div style="width: 100%;">
                <div class="fixed-company-text">
                    <span class="green-dot"></span>
                    <span th:text="${calendar.companyName != null ? calendar.companyName : '회사 캘린더'}">회사명</span>
                </div>
                <div class="sub-caption">회사 캘린더 일정입니다. 사내 전체 구성원에게 공개됩니다.</div>
            </div>
        </div>

        <hr class="edit-divider" />

        <!-- 메모 내용 -->
        <div class="form-row">
            <div class="form-icon"><i class="fa-regular fa-file-lines"></i></div>
            <div style="flex: 1;">
                <textarea name="content" class="textarea-custom" th:text="${calendar.content}" placeholder="메모를 작성하세요."></textarea>
            </div>
        </div>

        <hr class="edit-divider" />

        <!-- 작성자 정보 -->
        <div class="meta-info">
            <div>생성자 : <span th:text="${calendar.creatorName}">작성자</span></div>
        </div>
    </form>

    <!-- 삭제 요청 전송용 Hidden Form -->
    <form id="deleteFormInEdit" th:action="@{/adminUser/service/calendar/deleteCal}" method="post" style="display: none;">
        <input type="hidden" name="calenderNo" th:value="${calendar.calenderNo}" />
    </form>
</div>

</body>
</html>
