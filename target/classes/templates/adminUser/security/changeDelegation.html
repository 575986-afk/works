<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>권한 위임</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" th:href="@{/css/common.css}">

<style type="text/css">
* { box-sizing: border-box; }
body { background: #ffffff; font-family: "맑은 고딕", sans-serif; margin: 0; }
#wrap { width:100%; margin:0; }
#container { display:flex; min-height: calc(100vh - 56px); }

#main { flex:1; background:#fff; }
.pageContainer { width:100%; max-width: 1200px; margin: 0 auto; padding:35px 20px; }
.breadcrumb { font-size:12px; color:#9ca3af; margin-bottom:15px; }

.pageHeader { display: flex; align-items: center; gap: 12px; margin-bottom: 35px; }
.pageTitle { font-size:22px; font-weight:700; color:#1f2937; margin:0; }
.pageHeader .divider { color: #d1d5db; font-size: 14px; }
.backLink { font-size:13px; color:#6b7280; text-decoration:none; cursor:pointer; }
.backLink:hover { text-decoration:underline; color:#1f2937; }

.stepCard {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
    background: #fff;
}
.stepHeader {
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
    background: #ffffff;
}
.stepHeader .titleGroup {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 700;
    color: #1f2937;
}
.stepNum {
    background: #1f2937;
    color: #ffffff;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
}
.toggleIcon { color: #6b7280; font-size: 14px; }

.stepBody {
    background: #f9fafb;
    padding: 45px 20px;
    text-align: center;
    border-top: 1px solid #f3f4f6;
}

.guideTitle { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 8px; }
.guideSub { font-size: 12px; color: #6b7280; margin-bottom: 24px; }
.searchWrap { max-width: 380px; margin: 0 auto 20px; }
.searchWrap input {
    border: 1px solid #3b82f6;
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 13px;
    width: 100%;
    outline: none;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
}
.btnNext {
    background-color: #2563eb;
    color: #ffffff;
    border: none;
    padding: 8px 32px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}
.btnNext:hover { background-color: #1d4ed8; }

.statusDeadline { color: #2563eb; font-weight: 700; font-size: 13px; margin-top: 6px; margin-bottom: 28px; }
.flowWrap {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
}
.userBadge {
    background: #ffffff;
    border: 1px solid #d1d5db;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    color: #374151;
    display: flex;
    align-items: center;
    gap: 8px;
}
.arrowIcon { color: #9ca3af; font-size: 16px; }
.btnCancel {
    background: #ffffff;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 6px 20px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
}
.btnCancel:hover { background: #f3f4f6; }
</style>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
$(function(){
    // 아코디언 열고 닫기
    $(".stepHeader").click(function(){
        let $body = $(this).next(".stepBody");
        let $icon = $(this).find(".toggleIcon");

        $body.slideToggle(200);
        $icon.toggleClass("fa-chevron-down fa-chevron-up");
    });

    // 이전으로 돌아가기 클릭
    $(".backLink").click(function(){
        location.href = "/adminUser/security/authority";
    });

    // 1단계 다음
    $("#nextStepBtn").click(function(){
        let searchVal = $("#memberSearchInput").val().trim();
        if(!searchVal) {
            alert("위임할 구성원의 이름 또는 ID를 입력하세요.");
            return;
        }

        $.ajax({
            url: "/adminUser/security/changeDelegation",
            type: "POST",
            data: { targetUserId: searchVal },
            success: function(res){
                // 성공 시 새로고침 (컨트롤러에서 isWaiting을 true로 넘기면 2단계가 표시됨)
                location.reload();
            },
            error: function(){
                alert("권한 위임 요청 처리 중 오류가 발생했습니다.");
            }
        });
    });

    // 위임 취소
    $("#cancelDelegationBtn").click(function(){
        if(confirm("권한 위임을 취소하시겠습니까?")){
            $.ajax({
                url: "/adminUser/security/cancelDelegation",
                type: "POST",
                success: function(res){
                    alert("위임 요청이 취소되었습니다.");
                    // 취소 성공 시 새로고침
                    location.reload();
                },
                error: function(){
                    alert("취소 처리 중 오류가 발생했습니다.");
                }
            });
        }
    });
});
</script>
</head>
<body>

<th:block th:replace="~{fragments/header :: headerFragment}"></th:block>

<div id="container">
    <th:block th:replace="~{fragments/sidebar :: sidebarFragment}"></th:block>

    <div id="main">
        <div class="pageContainer">
            <div class="breadcrumb">메인 &gt; 보안 &gt; 관리자 권한 &gt; 권한 위임</div>

            <div class="pageHeader">
                <h2 class="pageTitle">권한 위임</h2>
                <span class="divider">|</span>
                <a class="backLink">이전으로 돌아가기</a>
            </div>

            <!-- 1단계: 위임할 구성원 선택 -->
            <div class="stepCard">
                <div class="stepHeader">
                    <div class="titleGroup">
                        <span class="stepNum">1</span>
                        <span>위임할 구성원 선택</span>
                    </div>
                    <i class="fa-solid toggleIcon" th:classappend="${isWaiting} ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
                </div>
                <div id="step1Body" class="stepBody" th:style="${isWaiting} ? 'display:none;' : 'display:block;'">
                    <div class="guideTitle">최고관리자 권한을 위임할 구성원을 선택해 주세요.</div>
                    <div class="guideSub">선택한 구성원에게 메일이 발송되고, 14일 내에 수락해야 위임이 완료됩니다.</div>
                    
                    <div class="searchWrap">
                        <input type="text" id="memberSearchInput" placeholder="이름 또는 ID 검색">
                    </div>
                    
                    <button type="button" id="nextStepBtn" class="btnNext">다음</button>
                </div>
            </div>

            <!-- 2단계: 위임 수락 -->
            <div class="stepCard">
                <div class="stepHeader">
                    <div class="titleGroup">
                        <span class="stepNum">2</span>
                        <span>위임 수락</span>
                    </div>
                    <i class="fa-solid toggleIcon" th:classappend="${isWaiting} ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                </div>
                <div id="step2Body" class="stepBody" th:style="${isWaiting} ? 'display:block;' : 'display:none;'">
                    
                    <div class="guideTitle">
                        최고관리자 권한을 위임하기 위해 
                        <span class="text-primary fw-bold" th:text="${receiverName}">김철수</span>님의 수락을 기다리고 있습니다.
                    </div>
                    
                    <div class="statusDeadline" th:text="${deadlineDate}">
                        2026년 8월 27일까지 수락 필요
                    </div>

                    <div class="flowWrap">
                        <!-- 보낸 사람 -->
                        <div class="userBadge">
                            <i class="fa-regular fa-user text-secondary"></i>
                            <span th:text="${senderInfo}">홍길동 testtest@practice-6.by-works.com</span>
                        </div>
                        
                        <i class="fa-solid fa-arrow-right arrowIcon"></i>
                        
                        <!-- 받은 사람 -->
                        <div class="userBadge">
                            <i class="fa-regular fa-user text-primary"></i>
                            <span th:text="${receiverInfo}">김철수 test1@practice-6.by-works.net</span>
                        </div>
                    </div>

                    <div>
                        <button type="button" id="cancelDelegationBtn" class="btnCancel">위임 취소</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
