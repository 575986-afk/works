<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="addGrpForm" id="groupAddEditModal" class="customModal" style="display: block; z-index: 10001;">
    <div class="customModalContent" style="width: 580px;">
        
        <!-- 모달 헤더 -->
        <div class="customModalHeader" style="padding: 20px 24px; border-bottom: 1px solid #e5e7eb;">
            <h3 id="modalTitle" style="font-size: 18px; font-weight: 700; color: #111827; margin: 0;"
                th:text="${group != null ? '그룹 수정' : '그룹 추가'}">그룹 추가</h3>
            <button type="button" class="modalClose closeGroupAddEditModal">&times;</button>
        </div>

        <!-- 모달 바디 -->
        <form id="groupForm" style="padding: 20px 24px;">
            <!-- 그룹 번호 -->
            <input type="hidden" id="groupNo" name="groupNo" th:value="${group != null ? group.groupNo : ''}">
            
            <!-- 기존 마스터 ID 보관용 hidden 필드 -->
            <input type="hidden" id="initialMasterUserNo" th:value="${group != null ? group.userNo : ''}">

            <!-- 그룹명 -->
            <div class="formRow mb-3">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="font-size: 13px; font-weight: 700; color: #374151; margin: 0;">그룹명 <span style="color: #ef4444;">*</span></label>
                    <span style="font-size: 11px; color: #9ca3af;"><span id="groupNameLen" th:text="${group != null && group.groupName != null ? #strings.length(group.groupName) : 0}">0</span>/100</span>
                </div>
                <input type="text" id="groupNameInput" name="groupName" 
                       th:value="${group != null ? group.groupName : ''}" 
                       maxlength="100" class="form-control" placeholder="그룹명을 입력해 주세요" style="font-size: 13px; height: 40px;">
            </div>

            <!-- 그룹 설명 -->
            <div class="formRow mb-3">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <label style="font-size: 13px; font-weight: 700; color: #374151; margin: 0;">그룹 설명</label>
                    <span style="font-size: 11px; color: #9ca3af;"><span id="groupDescLen" th:text="${group != null && group.groupDesc != null ? #strings.length(group.groupDesc) : 0}">0</span>/300</span>
                </div>
                <input type="text" id="groupDescInput" name="groupDesc" 
                       th:value="${group != null ? group.groupDesc : ''}" 
                       maxlength="300" class="form-control" placeholder="설명을 입력해 주세요(선택)" style="font-size: 13px; height: 40px;">
            </div>

            <!-- 마스터 설정 -->
            <div class="formRow mb-3">
                <label style="font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 6px; display: block;">마스터</label>
                <div class="d-flex gap-2 mb-2">
                    <input type="text" id="masterSearchInput" class="form-control" placeholder="이름 또는 ID 검색" style="font-size: 13px; height: 40px;">
                    <button type="button" id="openMasterSelectBtn" class="btn btn-outline-secondary" th:onclick="|openAddressPopup('@{/popupAddr}')|" style="font-size: 13px; white-space: nowrap; width: 80px; height: 40px;">주소록</button>
                </div>

                <div id="selectedMasterBox" style="border: 1px solid #e5e7eb; border-radius: 6px; min-height: 80px; padding: 12px; background: #fafafa; display: flex; align-items: center; justify-content: center;">
                    <span id="emptyMasterText" 
                          th:style="${group != null && group.leaderName != null ? 'display:none;' : 'font-size: 13px; color: #9ca3af;'}">그룹 마스터를 추가해 주세요</span>
                    
                    <div id="selectedMasterItem" 
                         th:style="${group != null && group.leaderName != null ? 'display: flex; width: 100%; align-items: center; justify-content: space-between; background: #fff; padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px;' : 'display: none;'}">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div style="width: 32px; height: 32px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; color: #9ca3af;">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <div>
                                <span id="selectedMasterName" style="font-size: 13px; font-weight: 700; color: #111827;" 
                                      th:text="${group != null ? group.leaderName : ''}"></span>
                            </div>
                        </div>
                        <i class="fa-solid fa-xmark" id="btnRemoveMaster" style="cursor: pointer; color: #ef4444;"></i>
                    </div>
                </div>
            </div>
        </form>

        <!-- 모달 푸터 -->
        <div class="customModalFooter" style="padding: 16px 24px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 8px;">
            <button type="button" class="btn btn-outline-secondary closeGroupAddEditModal" style="font-size: 13px; padding: 6px 18px;">취소</button>
            <button type="button" id="btnSaveGroup" class="btn btn-primary" style="font-size: 13px; padding: 6px 18px; background-color: #2563eb;">저장</button>
        </div>
    </div>

    <!-- 스크립트 -->
    <script type="text/javascript">
 	// 팝업 창 오픈 함수
    function openAddressPopup(url) {
        const title = "AddressBookPopup";
        const specs = "width=850,height=600,left=200,top=100,scrollbars=yes,resizable=yes";
        window.open(url, title, specs);
    }
    window.addRepresentative = function(userName, userNo) {
        console.log("=== 주소록 팝업에서 선택된 마스터 ===", userName, userNo);
        
        if (!userNo) return;

        // 마스터 1명 지정
        window.selectedMasterId = userNo;

        // UI 업데이트
        $("#emptyMasterText").hide();
        $("#selectedMasterName").text(userName);
        $("#selectedMasterItem").css("display", "flex");
    };
    
    $(function(){
        // 기존 마스터 ID 세팅
        window.selectedMasterId = $("#initialMasterUserNo").val() || "";

        // 1. 글자 수 카운팅
        $(document).off("input", "#groupNameInput").on("input", "#groupNameInput", function(){
            $("#groupNameLen").text($(this).val().length);
        });
        
        $(document).off("input", "#groupDescInput").on("input", "#groupDescInput", function(){
            $("#groupDescLen").text($(this).val().length);
        });

        // 2. 취소 / 모달 닫기
        $(document).off("click", ".closeGroupAddEditModal").on("click", ".closeGroupAddEditModal", function(e){
            e.preventDefault();
            $("#addGroupFormArea").empty();
        });

        // 4. 마스터 삭제 (X 버튼 클릭)
        $(document).off("click", "#btnRemoveMaster").on("click", "#btnRemoveMaster", function(){
            window.selectedMasterId = "";
            $("#selectedMasterItem").hide();
            $("#emptyMasterText").show();
        });

        // 5. 저장 / 수정 처리
        $(document).off("click", "#btnSaveGroup").on("click", "#btnSaveGroup", function(e){
            e.preventDefault();

            const groupNo = $.trim($("#groupNo").val());
            const groupName = $.trim($("#groupNameInput").val());
            const groupDescription = $.trim($("#groupDescInput").val());
            
            // 새로 선택한 마스터 ID가 없으면 기존 ID 활용
            let masterNo = window.selectedMasterId || $.trim($("#initialMasterUserNo").val());

            // 그룹명 필수 검사
            if(!groupName) {
                alert("그룹명을 입력해 주세요.");
                $("#groupNameInput").focus();
                return;
            }

            // Form 전송 객체 생성
            const params = new URLSearchParams();
            params.append("groupNo", groupNo);
            params.append("groupName", groupName);
            params.append("groupDescription", groupDescription);
            params.append("userNo", masterNo);

            const targetUrl = groupNo ? "/adminUser/member/modifyGroup" : "/adminUser/member/addGroup";

            axios.post(targetUrl, params)
            .then(function(res){
                if(res.data === true || res.data === "success" || res.status === 200) {
                    alert(groupNo ? "그룹 정보가 수정되었습니다." : "그룹이 추가되었습니다.");
                    location.reload();
                } else {
                    alert("처리에 실패했습니다.");
                }
            })
            .catch(function(err){
                console.error("처리 오류:", err);
                alert("처리 중 오류가 발생했습니다.");
            });
        });
    });
    </script>
</div>

</body>
</html>
