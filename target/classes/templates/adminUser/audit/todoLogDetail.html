<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style type="text/css">
.detail-container {
    padding: 10px 4px;
}
.detail-item {
    margin-bottom: 22px;
}
.detail-item label {
    display: block;
    font-size: 12px;
    color: #718096;
    font-weight: 600;
    margin-bottom: 6px;
}
.detail-item .value {
    font-size: 14px;
    color: #1a1d20;
    word-break: break-all;
    line-height: 1.5;
}
.detail-item .sub-email {
    color: #8a94a6;
    font-size: 13px;
    margin-left: 4px;
}
</style>
</head>
<body>

<div class="detail-container">
    
    <div class="detail-item">
        <label>제목</label>
        <div class="value" th:text="${(logDetail.title ?: '-')}">
            요청 할일 리스트
        </div>
    </div>
    
    <div class="detail-item">
        <label>상태</label>
        <div class="value" th:text="${logDetail?.status == '1' ? '완료' : '미완료'}">
            미완료
        </div>
    </div>
    
    <div class="detail-item">
        <label>기한</label>
        <div class="value">
            <span th:text="${(logDetail.startDate ?: '')}"></span>
            ~
            <span th:text="${(logDetail.endDate ?: '')}"></span>
        </div>
    </div>
    
    <div class="detail-item">
        <label>요청자</label>
        <div class="value">
            <span th:text="${(logDetail.requesterName ?: '-')}">홍길동</span>
            (<span th:text="${(logDetail.requesterEmail ?: '-')}">test@test.com</span>)
        </div>
    </div>
    
    <div class="detail-item">
        <label>담당자</label>
        <div class="value">
            <span th:text="${(logDetail.assigneeName ?: '-')}">홍길동</span>
            (<span th:text="${(logDetail.assigneeEmail ?: '-')}">test@test.com</span>)
        </div>
    </div>

</div>

</body>
</html>
