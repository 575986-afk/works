spring.datasource.password=factory

# --- 2. MyBatis 설정 (경로 확인) ---
# XML 파일들이 있는 실제 폴더 구조에 맞춰주세요. (예: resouces/xml/ 폴더 안에 있다면 아래와 같이)
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=kr.co.sist.**
# --- 3. 기존에 작성하신 설정들 ---
spring.application.name=spring_thymleaf

# thymeleafViewResolver에 들어가는 설정
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# 파일업로드 관련설정
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.location=c:/dev/upload

#세션 시간 설정 
server.servlet.session.timeout=7200

#mybatis 
mybatis:
  type-handlers-package: kr.co.sist.login

#email
spring.mail.host=smtp.naver.com
spring.mail.port=465
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.naver.com
