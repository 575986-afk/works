<!-- Header -->
<header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0 z-50 relative" th:fragment="user-header">
    
    <!-- 로고 및 검색창 -->
    <div class="flex items-center gap-6">
        
        <!-- 1. 할일 로고 (클릭 시 할일 홈으로 이동) -->
        <a th:href="@{/todo}" class="flex items-center hover:opacity-80 transition-opacity">
            <div class="w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center text-white mr-2">
                <i class="fa-solid fa-check text-xs"></i>
            </div>
            <span class="font-bold text-lg text-gray-800">할일</span>
        </a>
        
        <!-- 2. 검색창 -->
        <div class="relative w-96 ml-2">
            <i class="fa-solid fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="할일 검색" class="w-full bg-gray-100 border-none rounded-full py-1.5 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-blue-100 text-sm">
            
            <!-- 검색창 드롭다운 -->
            <div id="searchDropdown" class="hidden absolute top-full left-0 mt-2 w-full bg-white border border-gray-200 rounded-md shadow-lg p-4 text-gray-500 text-sm z-50">
                최근 검색어가 없습니다.
            </div>
        </div>
    </div>

    <!-- 오른쪽: 유틸리티 메뉴 (기존과 동일) -->
    <div class="flex items-center gap-4 text-gray-600 text-lg">
        
        <!-- 앱 런처 (점 9개) -->
        <div class="relative">
            <button id="appLauncherBtn" class="hover:text-gray-800 focus:outline-none pt-1">
                <i class="fa-solid fa-grip"></i>
            </button>
            <!-- 앱 런처 드롭다운 -->
            <div id="appLauncherDropdown" class="hidden absolute top-full right-0 mt-3 w-72 bg-white border border-gray-200 rounded-lg shadow-xl p-4 z-50">
                <div class="grid grid-cols-3 gap-y-4 gap-x-2 text-center">
                    <a th:href="@{/home}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                        <i class="fa-solid fa-house text-blue-500 text-2xl mb-2"></i>
                        <span class="text-xs text-gray-700">홈</span>
                    </a>
                    <a th:href="@{/message}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                        <i class="fa-solid fa-comment text-green-500 text-2xl mb-2"></i>
                        <span class="text-xs text-gray-700">메시지</span>
                    </a>
                    <a th:href="@{/calendar}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                        <i class="fa-solid fa-calendar text-indigo-500 text-2xl mb-2"></i>
                        <span class="text-xs text-gray-700">캘린더</span>
                    </a>
                    <a th:href="@{/addressBook}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                        <i class="fa-solid fa-address-book text-teal-500 text-2xl mb-2"></i>
                        <span class="text-xs text-gray-700">주소록</span>
                    </a>
                    <a th:href="@{/todo}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                        <i class="fa-solid fa-circle-check text-blue-500 text-2xl mb-2"></i>
                        <span class="text-xs text-gray-700">할 일</span>
                    </a>
                    <a th:if="${session.user != null and session.user.role != null and session.user.role >= '50'}"
                    th:href="@{/admin}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                        <i class="fa-solid fa-user-tie text-gray-500 text-2xl mb-2"></i>
                        <span class="text-xs text-gray-700">Admin</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- 구분선 -->
        <div class="w-px h-4 bg-gray-300 mx-1"></div>

        <!-- 종 (알림) -->
        <div class="relative">
            <button id="notiBtn" class="hover:text-gray-800 focus:outline-none pt-1">
                <i class="fa-regular fa-bell"></i>
            </button>
            <div id="notiDropdown" class="hidden absolute top-full right-0 mt-3 w-80 bg-white border border-gray-200 rounded-lg shadow-xl p-4 z-50">
                <div class="text-center text-gray-500 text-sm py-4">새로운 알림이 없습니다.</div>
            </div>
        </div>

        <!-- ? (고객센터) -->
        <a th:href="@{/user/notices}" class="hover:text-gray-800 pt-1">
            <i class="fa-regular fa-circle-question"></i>
        </a>

        <!-- 톱니바퀴 (환경설정) -->
        <a th:href="@{/settings}" class="hover:text-gray-800 pt-1">
            <i class="fa-solid fa-gear"></i>
        </a>

        <!-- 프로필 -->
        <div class="relative ml-2">
            <button id="profileBtn" class="w-8 h-8 rounded-full bg-blue-400 text-white flex items-center justify-center font-bold text-sm focus:outline-none"
            		th:classappend="${session.user?.profileImage != null ? session.user?.profileImage : 'bg-gray-400'}"
                    th:text="${session.user?.userName != null ? #strings.substring(session.user?.userName, 0, 1) : 'U'}">
            </button>
            <div id="profileDropdown" class="hidden absolute top-full right-0 mt-3 w-64 bg-white border border-gray-200 rounded-lg shadow-xl z-50 overflow-hidden">
                <div class="p-4 flex items-center gap-3 border-b border-gray-100 bg-gray-50">
                    <div class="w-11 h-11 rounded-full bg-blue-400 text-white flex items-center justify-center font-bold text-lg"
                    th:classappend="${session.user?.profileImage != null ? session.user?.profileImage : 'bg-gray-400'}"
                    th:text="${session.user?.userName != null ? #strings.substring(session.user?.userName, 0, 1) : 'U'}"
                    >U</div>
                    <div class="font-bold text-gray-800 text-base" th:text="${session.user?.userName != null ? session.user?.userName : '로그인 필요'}">이름</div>
                </div>
                <div class="p-2">
                    <button class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md flex items-center gap-2">
                        <i class="fa-solid fa-plus border border-gray-400 rounded-full p-0.5 text-[10px]"></i>상태 설정
                    </button>
                    <button class="w-full text-left px-3 py-2 text-sm text-gray-700 hover:bg-gray-100 rounded-md flex items-center gap-2">
                        <i class="fa-solid fa-bell-slash text-gray-500"></i>알림 일시 정지
                    </button>
                </div>
                <div class="border-t border-gray-100 p-2">
                    <a th:href="@{/logout}" class="w-full text-left px-3 py-2 text-sm text-red-500 hover:bg-red-50 rounded-md flex items-center gap-2 font-medium">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>로그아웃
                    </a>
                </div>
            </div>
        </div>
        
    </div>

</header>
