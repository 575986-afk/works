<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<style>
header {
    width: 100%;
    height: 60px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    padding-left: 30px;
    margin: 0;
    box-sizing: border-box;
}

.header-logo {
    width: 20px;
    height: 20px;
    background-color: #00c6c9;
    border-radius: 3px;
    margin-right: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 10px;
    font-weight: 800;
}
</style>
</head>
<body>

<header th:fragment="commonHeader">
    <div class="header-logo">W</div>
</header>

</body>
</html>
