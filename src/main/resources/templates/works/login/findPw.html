<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>비밀번호 찾기</title>
<link rel="stylesheet" th:href="@{/common/css/login.css}" />
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'맑은 고딕', sans-serif;
}
body{ background:#f3f3f3; }
header{ width:100%; height:60px; background:white; border-bottom:1px solid #ddd; display:flex; align-items:center; padding-left:30px; }
.header-logo { width: 20px; height: 20px; background-color: #00c6c9; border-radius: 3px; margin-right: 6px; display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: 800; }
.container{ width:100%; display:flex; justify-content:center; margin-top:150px; }
.find-box{ width:550px; height:400px; background:white; border-radius:10px; padding:35px 30px; padding-left:50px; padding-right:50px; padding-top: 50px; }
.find-box h2{ text-align:center; height:50px; font-size:24px; }
.desc{ text-align:center; font-size:12px; color:#999; margin-bottom:25px; }
.input-box{ margin-bottom:15px; }
.input-box input{ width:100%; height:40px; border:1px solid #ddd; padding-left:10px; font-size:13px; }
.email-box{ display:flex; gap:5px; }
.email-box input{ flex:1; border:1px solid #ddd; height:40px; }
.result{ margin-top:10px; font-size:11px; color:#555; text-align:center; }
.find-btn{ width:100%; height:40px; margin-top:20px; background:#1f7ef2; color:white; border:none; border-radius:3px; cursor:pointer; }
.center{ color:#75FA61; }
</style>

</head>

<body>

    <div th:replace="~{fragments/loginHeader :: commonHeader}"></div>

<div class="container">
    <div class="find-box">
        <h2>비밀번호 찾기</h2>

        <div class="desc">
            회원가입 시 등록한 이메일 입력 후 <br>
            [이메일 요청]을 하면 인증번호가 전달됩니다.
        </div>

        <form th:action="@{/checkUser}" method="post">
            <div class="input-box">
                <input type="text" name="userId" placeholder="아이디를 입력해주세요." required>
            </div>

            <div class="email-box">
                <input type="email" name="email" placeholder="이메일을 입력해 주세요." required>
            </div>

            <div class="result">
                <span th:text="${msg}">
                    비밀번호 찾기에 문제가 있으시면 <span class="center">고객센터</span>를 통해 문의해 주세요.
                </span>
            </div>

            <button type="submit" class="find-btn">
                이메일 요청
            </button>
        </form>
    </div>
</div>

<script th:if="${errorMessage != null}">
    alert([[${errorMessage}]]);
</script>

</body>
</html>
