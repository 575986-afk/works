<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메신저</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;
        }

        body {
            background-color: #f5f6f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: 60px; /* fixed 헤더 높이만큼 여백 확보 */
        }

        /* 메인 컨테이너 */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            width: 100%;
        }

        /* 좌측 사이드바 */
        .sidebar {
            width: 320px;
            background-color: #ffffff;
            border-right: 1px solid #dddddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .btn-create {
            background-color: #2E77E0;
            color: white;
            border: none;
            border-radius: 20px;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .sidebar-sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
        }

        .room-item {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f9f9f9;
            position: relative;
        }

        .room-item:hover {
            background-color: #f7f9fc;
        }

        .room-item.active {
            background-color: #ebf5ee;
        }

        .room-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2E77E0;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .room-info {
            flex: 1;
            min-width: 0;
        }

        .room-info-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .room-name {
            font-size: 14px;
            font-weight: bold;
            color: #111;
        }

        .room-time {
            font-size: 11px;
            color: #888;
        }

        .room-preview {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background-color: #ff3b30;
            color: white;
            font-size: 10px;
            border-radius: 10px;
            padding: 2px 6px;
            position: absolute;
            right: 16px;
            bottom: 12px;
        }

        /* 우측 대화창 영역 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
        }

        .chat-header {
            height: 52px;
            border-bottom: 1px solid #dddddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .chat-room-title {
            font-size: 15px;
            font-weight: bold;
            color: #111;
        }

        .chat-room-title span {
            font-size: 12px;
            color: #888;
            margin-left: 6px;
            font-weight: normal;
        }

        .chat-options {
            font-size: 18px;
            color: #555;
            cursor: pointer;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        .date-divider {
            font-size: 12px;
            color: #888;
            background-color: #f1f3f5;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .system-message {
            font-size: 13px;
            color: #666;
            text-align: center;
            line-height: 1.5;
        }

        /* 하단 메시지 입력창 */
        .chat-input-area {
            border-top: 1px solid #dddddd;
            padding: 12px 16px;
            background-color: #ffffff;
        }

        .chat-input-box {
            background-color: #f8f9fa;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-input-box textarea {
            border: none;
            background: transparent;
            outline: none;
            resize: none;
            height: 40px;
            font-size: 13px;
        }

        .chat-input-actions {
            display: flex;
            gap: 12px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 (요청하신 디자인 및 검색창 추가 적용) -->
    <header th:fragment="commonHeader" style="width: 100%; height: 60px; background: white; border-bottom: 1px solid #dddddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px 0 30px; position: fixed; top: 0; left: 0; z-index: 1000; box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;">
         <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 20px; height: 20px; background-color: #2E77E0; border-radius: 3px; display: flex; justify-content: center; align-items: center; color: white; font-size: 10px; font-weight: 800;">W</div>
   			 <a th:href="@{/userMain}" style="display: flex; align-items: center; gap: 6px; color: #333333; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f7ef2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span style="color: inherit;"><span>메시지</span></span>
       		 </a>
        </div> 
           <!-- <div style="display: flex; align-items: center; gap: 6px; color: #333333; font-size: 14px; font-weight: 600; cursor: pointer;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f7ef2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                
            </div>-->

        <!-- 중앙 검색창 -->
        <div style="flex: 0 1 340px; position: relative; margin: 0 20px;">
            <form th:action="@{/search}" method="get" style="display: flex; align-items: center; width: 100%;">
                <div style="background-color: #f1f3f5; border-radius: 4px; padding: 6px 12px 6px 32px; display: flex; align-items: center; width: 100%; position: relative;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%);">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" name="keyword" placeholder="메시지 검색" style="border: none; background: transparent; outline: none; font-size: 13px; width: 100%; color: #333; font-family: inherit;">
                </div>
            </form>
        </div>

        <div style="display: flex; align-items: center; gap: 16px;">
            <button type="button" title="앱 목록" style="background: none; border: none; cursor: pointer; color: #666666; display: flex; align-items: center; justify-content: center; padding: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>
            <button type="button" title="알림" style="background: none; border: none; cursor: pointer; color: #666666; display: flex; align-items: center; justify-content: center; padding: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
            </button>
            <button type="button" title="도움말" style="background: none; border: none; cursor: pointer; color: #666666; display: flex; align-items: center; justify-content: center; padding: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </button>
            <a href="/userInfo" title="설정" style="background: none; border: none; cursor: pointer; color: #666666; display: flex; align-items: center; justify-content: center; padding: 4px; text-decoration: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </a>
            <button type="button" title="프로필" style="background: none; border: none; cursor: pointer; color: #666666; display: flex; align-items: center; justify-content: center; padding: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        
        <!-- 좌측 사이드바 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="btn-create">새로 만들기</button>
            </div>
            <div class="sidebar-sub-header">
                <span>메시지방</span>
                <span>⇅</span>
            </div>
            
            <!-- 방 목록 (타임리프 반복문 예시) -->
            <div class="room-list">
                <div class="room-item active" th:each="room : ${roomList}" th:classappend="${room.id == currentRoomId} ? 'active'">
                    <div class="room-avatar" th:text="${#strings.substring(room.name,0,1)}">김</div>
                    <div class="room-info">
                        <div class="room-info-top">
                            <span class="room-name" th:text="${room.name}">김철수</span>
                            <span class="room-time" th:text="${room.lastTime}">7.15.</span>
                        </div>
                        <div class="room-preview" th:text="${room.lastMessage}">궁금한 점을 우리는 무엇인가요?</div>
                    </div>
                    <div class="unread-badge" th:if="${room.unreadCount > 0}" th:text="${room.unreadCount}">2</div>
                </div>

                <div class="room-item">
                    <div class="room-avatar">홍</div>
                    <div class="room-info">
                        <div class="room-info-top">
                            <span class="room-name">홍길동</span>
                            <span class="room-time">7.15.</span>
                        </div>
                        <div class="room-preview">나에게만 보이는 메시지입니다.</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 우측 대화창 -->
        <main class="chat-area">
            <div class="chat-header">
                <div class="chat-room-title">
                    <span th:text="${currentRoomName}">홍길동</span>
                    <span th:text="${currentRoomTeam}">2조</span>
                </div>
                <div class="chat-options">⋮</div>
            </div>

            <div class="chat-body">
                <div class="date-divider" th:text="${currentDate}">2026. 7. 15. (수)</div>
                <div class="system-message">
                    나에게만 보이는 메시지방입니다.<br>
                    기록하고 싶은 내용을 적어두거나 자주 사용하는 링크, 파일을 보관해 보세요.
                </div>
            </div>

            <!-- 하단 입력창 -->
            <div class="chat-input-area">
                <div class="chat-input-box">
                    <textarea placeholder="메시지를 입력하세요..."></textarea>
                    <div class="chat-input-actions">
                        <span>➕</span>
                        <span>🔗</span>
                        <span>📊</span>
                    </div>
                </div>
            </div>
        </main>

    </div>

</body>
</html>
