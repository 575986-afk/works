<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>메신저</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #f5f6f8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .main-container { display: flex; flex: 1; height: calc(100vh - 56px); width: 100%; }
        
        .sidebar { width: 320px; background-color: #ffffff; border-right: 1px solid #dddddd; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
        .btn-create { background-color: #2E77E0; color: white; border: none; border-radius: 20px; width: 100%; padding: 10px; font-weight: bold; font-size: 14px; cursor: pointer; text-align: center; }
        .room-list { flex: 1; overflow-y: auto; }
        .room-item { padding: 12px 16px; display: flex; gap: 12px; cursor: pointer; border-bottom: 1px solid #f9f9f9; align-items: center; }
        .room-item:hover { background-color: #f7f9fc; }
        .room-item.active { background-color: #ebf5ee; }
        .room-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #2E77E0; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .room-info { flex: 1; min-width: 0; }
        .room-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .room-name { font-size: 14px; font-weight: bold; color: #111; }
        .room-time { font-size: 10px; color: #888; white-space: nowrap; margin-left: 4px; }
        .room-preview { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #ffffff; }
        .chat-header { height: 52px; border-bottom: 1px solid #dddddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 15px; font-weight: bold; color: #111; background-color: #ffffff; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; background-color: #f8f9fa; gap: 16px; }
        
        .message-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
        .message-row.my-message { flex-direction: row-reverse; }
        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; background-color: #2E77E0; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; flex-shrink: 0; }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 300px; }
        .message-row.my-message .message-wrapper { align-items: flex-end; }
        
        .message-sender { font-size: 11px; color: #555; margin-bottom: 3px; }
        
        .message-content-group { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
        .message-row:not(.my-message) .message-content-group { flex-direction: row; }
        .message-row.my-message .message-content-group { flex-direction: row-reverse; }

        .message-bubble { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-break: break-word; background-color: #ffffff; color: #111; border: 1px solid #e1e4e8; }
        .message-row.my-message .message-bubble { background-color: #fee500; border: none; }
        
        .message-time { font-size: 10px; color: #888; white-space: nowrap; margin-bottom: 2px; }
        
        .chat-input-area { border-top: 1px solid #dddddd; padding: 10px 16px; background-color: #ffffff; display: flex; flex-direction: column; gap: 6px; }
        .chat-input-box { display: flex; align-items: center; border: 1px solid #d1d5db; border-radius: 8px; background-color: #ffffff; padding: 4px 8px; gap: 8px; }
        .chat-input-box:focus-within { border-color: #2E77E0; }
        
        .chat-attach-btn { background: none; border: none; color: #555; font-size: 18px; cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .chat-attach-btn:hover { color: #2E77E0; }

        .chat-input-area textarea { flex: 1; height: 36px; border: none; outline: none; resize: none; font-size: 13px; padding-top: 8px; background: transparent; }
    </style>
</head>
<body>
    <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0 z-50 relative">
        <div class="flex items-center gap-6">
            <a th:href="@{/userDashboard}" class="flex items-center gap-2 text-teal-500 font-bold text-lg hover:opacity-80">
                <i class="fa-solid fa-comment text-blue-500 text-2xl mb-2"></i>
                <span class="text-gray-800">메시지</span>
            </a>
        </div>
        
        <div style="flex: 0 1 340px; position: relative; margin: 0 20px;">
            <div style="background-color: #f1f3f5; border-radius: 4px; padding: 6px 12px 6px 32px; display: flex; align-items: center; width: 100%; position: relative;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%);">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchKeyword" placeholder="채팅방 이름 검색" style="border: none; background: transparent; outline: none; font-size: 13px; width: 100%; color: #333;" autocomplete="off">
            </div>
            
            <div id="searchDropdown" style="display: none; position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; max-height: 300px; overflow-y: auto; margin-top: 5px;">
            </div>
        </div>

        <div class="flex items-center gap-4 text-gray-600 text-lg">
            <div class="relative">
                <button id="appLauncherBtn" class="hover:text-gray-800 focus:outline-none pt-1">
                    <i class="fa-solid fa-grip"></i>
                </button>
                <div id="appLauncherDropdown" class="hidden absolute top-full right-0 mt-3 w-72 bg-white border border-gray-200 rounded-lg shadow-xl p-4 z-50">
                    <div class="grid grid-cols-3 gap-y-4 gap-x-2 text-center">
                        <a th:href="@{/userDashboard}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                            <i class="fa-solid fa-house text-blue-500 text-2xl mb-2"></i>
                            <span class="text-xs text-gray-700">홈</span>
                        </a>
                        <a th:href="@{/chatting}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                            <i class="fa-solid fa-comment text-green-500 text-2xl mb-2"></i>
                            <span class="text-xs text-gray-700">메시지</span>
                        </a>
                        <a th:href="@{/calendar}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                            <i class="fa-solid fa-calendar text-indigo-500 text-2xl mb-2"></i>
                            <span class="text-xs text-gray-700">캘린더</span>
                        </a>
                        <a th:href="@{/addressBook}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                            <i class="fa-solid fa-address-book text-teal-500 text-2xl mb-2"></i>
                            <span class="text-xs text-gray-700">주소록</span>
                        </a>
                        <a th:href="@{/todo}" class="flex flex-col items-center p-2 hover:bg-gray-50 rounded-lg">
                            <i class="fa-solid fa-circle-check text-purple-500 text-2xl mb-2"></i>
                            <span class="text-xs text-gray-700">할 일</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="w-px h-4 bg-gray-300 mx-1"></div>

            <div class="relative">
                <button id="notiBtn" class="hover:text-gray-800 focus:outline-none pt-1">
                    <i class="fa-regular fa-bell"></i>
                </button>
                <div id="notiDropdown" class="hidden absolute top-full right-0 mt-3 w-80 bg-white border border-gray-200 rounded-lg shadow-xl p-4 z-50">
                    <div class="text-center text-gray-500 text-sm py-4">새로운 알림이 없습니다.</div>
                </div>
            </div>

            <div class="relative ml-2">
                <button id="profileBtn"
                    class="w-8 h-8 rounded-full bg-gray-400 text-white flex items-center justify-center font-bold text-sm focus:outline-none"
                    th:text="${not #strings.isEmpty(session.user?.name) ? #strings.substring(session.user?.name, 0, 1) : 'U'}">
                </button>
                <div id="profileDropdown" class="hidden absolute top-full right-0 mt-3 w-64 bg-white border border-gray-200 rounded-lg shadow-xl z-50 overflow-hidden">
                   <div class="p-4 flex items-center gap-3 border-b border-gray-100 bg-gray-50">
                        <div class="w-11 h-11 rounded-full bg-gray-400 text-white flex items-center justify-center font-bold text-lg"
                            th:text="${not #strings.isEmpty(session.user?.name) ? #strings.substring(session.user?.name, 0, 1) : 'U'}">U</div>
                        <div class="font-bold text-gray-800 text-base" th:text="${session.user?.name != null ? session.user?.name : '로그인 필요'}">이름</div>
                    </div>
                    <div class="border-t border-gray-100 p-2">
                        <a th:href="@{/logout}" class="w-full text-left px-3 py-2 text-sm text-red-500 hover:bg-red-50 rounded-md flex items-center gap-2 font-medium">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>로그아웃
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>
    
    <div class="main-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="btn-create" onclick="openAddressPopupWithRoomName(); return false;">새로 만들기</button>
            </div>
            <div class="room-list">
                <div class="room-item" th:each="room : ${chatRoomList}" th:classappend="${room.chatRoomNo == currentRoomId} ? 'active'" th:onclick="|location.href='@{/chatting(chatRoomNo=${room.chatRoomNo})}'|">
                    <div class="room-avatar" th:text="${#strings.substring(room.chatRoomName, 0, 1)}"></div>
                    <div class="room-info">
                        <div class="room-info-top">
                            <span class="room-name" th:text="${room.chatRoomName}"></span>
                            <span class="room-time" th:text="${room.lastTime}"></span>
                        </div>
                        <div class="room-preview" th:text="${room.lastMessage != null ? room.lastMessage : ''}"></div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="chat-area">
            <div class="chat-header">
                <span th:text="${currentRoomName != null ? currentRoomName : '메시지'}">메시지</span>
                <button type="button" id="leaveRoomBtn" 
                        th:if="${currentRoomId != null}"
                        th:data-roomno="${currentRoomId}"
                        class="px-3 py-1 text-xs font-medium text-red-600 bg-red-50 border border-red-200 rounded hover:bg-red-100">
                    나가기
                </button>
            </div>

            <div class="chat-body">
                <div class="system-message" style="margin: auto; color: #666; font-size: 13px; text-align: center;" th:if="${currentRoomId == null}">
                    채팅방을 선택해주세요.
                </div>
            </div>

            <div class="chat-input-area">
                <div id="filePreviewContainer" style="display: none; align-items: center; justify-content: space-between; background-color: #f1f3f5; padding: 6px 10px; border-radius: 4px; font-size: 12px;">
                    <span id="filePreviewName" style="color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></span>
                    <button type="button" id="removeFileBtn" style="background: none; border: none; color: #ff4d4f; cursor: pointer; font-weight: bold; margin-left: 8px;">✕</button>
                </div>

                <!-- 입력창 박스 구조 (첨부 버튼이 젤 왼쪽에 위치) -->
                <div class="chat-input-box">
                    <button type="button" class="chat-attach-btn" id="fileAttachBtn" title="파일 첨부">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                    <textarea id="chatInputText" placeholder="메시지를 입력하세요..."></textarea>
                </div>
                
                <div class="flex justify-end items-center px-1">
                    <div class="text-xs text-gray-400">Shift + Enter 줄바꿈</div>
                </div>
                <input type="file" id="hiddenFileInput" style="display: none;">
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    const currentRoomNo = '[[${currentRoomId}]]';
    const myName = '[[${session.user.name}]]';       
    const myUserNo = String('[[${session.user.userNo}]]').trim();
    let isSubmitting = false;
    let stompClient = null;
    let attachedFile = null;

    $(document).ready(function() {
        const appLauncherBtn = document.getElementById('appLauncherBtn');
        const appLauncherDropdown = document.getElementById('appLauncherDropdown');
        const notiBtn = document.getElementById('notiBtn');
        const notiDropdown = document.getElementById('notiDropdown');
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');

        if(appLauncherBtn) {
            appLauncherBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = appLauncherDropdown.classList.contains('hidden');
                closeAllDropdowns();
                if (isHidden) appLauncherDropdown.classList.remove('hidden');
            });
        }

        if(notiBtn) {
            notiBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = notiDropdown.classList.contains('hidden');
                closeAllDropdowns();
                if (isHidden) notiDropdown.classList.remove('hidden');
            });
        }

        if(profileBtn) {
            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isHidden = profileDropdown.classList.contains('hidden');
                closeAllDropdowns();
                if (isHidden) profileDropdown.classList.remove('hidden');
            });
        }

        document.addEventListener('click', () => {
            closeAllDropdowns();
        });

        function closeAllDropdowns() {
            if(appLauncherDropdown) appLauncherDropdown.classList.add('hidden');
            if(notiDropdown) notiDropdown.classList.add('hidden');
            if(profileDropdown) profileDropdown.classList.add('hidden');
        }

        if (currentRoomNo) {
            fetchMessages();
            connectWebSocket();
        }

        $('#leaveRoomBtn').on('click', function() {
            if (!confirm('정말 채팅방에서 나가시겠습니까?')) return;
            const chatRoomNo = $(this).attr('data-roomno');
            
            $.ajax({
                url: '/chat/leave',
                type: 'POST',
                data: { chatRoomNo: chatRoomNo },
                success: function(response) {
                    if (response === 'SUCCESS') {
                        alert('채팅방을 나갔습니다.');
                        location.href = '/chatting';
                    } else {
                        alert('채팅방 나가기에 실패했습니다.');
                    }
                }
            });
        });

        // 통합된 파일 첨부 버튼 클릭 이벤트
        $('#fileAttachBtn').on('click', function() {
            if (!currentRoomNo) { alert('채팅방을 먼저 선택해주세요.'); return; }
            $('#hiddenFileInput').click();
        });

        $('#hiddenFileInput').on('change', function() {
            const file = this.files[0];
            if (!file) return;
            attachedFile = file;
            $('#filePreviewName').text('📎 ' + file.name);
            $('#filePreviewContainer').css('display', 'flex');
        });

        $('#removeFileBtn').on('click', function() {
            attachedFile = null;
            $('#filePreviewContainer').hide();
            $('#hiddenFileInput').val('');
        });
    });

    function connectWebSocket() {
        let socket = new SockJS('/ws-chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            stompClient.subscribe('/sub/chat/room/' + currentRoomNo, function(messageOutput) {
                let message = JSON.parse(messageOutput.body);
                appendMessage(message);
                refreshChatRoomList();
            });
            
            stompClient.subscribe('/sub/chat/user/' + myUserNo, function(messageOutput) {
                refreshChatRoomList();
            });
        });
    }

    $('.chat-input-area textarea').on('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (isSubmitting) return;
            
            const content = $(this).val().trim();
            if (!content && !attachedFile) return;
            if (!currentRoomNo) { alert('채팅방을 먼저 선택해주세요.'); return; }

            isSubmitting = true;

            if (attachedFile) {
                const formData = new FormData();
                formData.append('file', attachedFile);
                formData.append('chatRoomNo', currentRoomNo);
                formData.append('sendUser', myUserNo);
                formData.append('sendUserName', myName);
                if (content) {
                    formData.append('content', content);
                }

             // 파일 업로드 AJAX 성공 부분 수정
                $.ajax({
                    url: '/chat/uploadFile',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(res) {
                        if (res === 'SUCCESS') {
                            $('#chatInputText').val('');
                            attachedFile = null;
                            $('#filePreviewContainer').hide();
                            $('#hiddenFileInput').val('');
                        } else {
                            alert('파일 전송에 실패했습니다.');
                        }
                        isSubmitting = false;
                    },
                    error: function() {
                        alert('파일 전송 중 오류가 발생했습니다.');
                        isSubmitting = false;
                    }
                });
            } else {
                if (!stompClient || !stompClient.connected) {
                    alert('웹소켓 연결이 되지 않았습니다.');
                    isSubmitting = false;
                    return;
                }

                let messageData = {
                    chatRoomNo: currentRoomNo,
                    content: content,
                    sendUser: myUserNo,
                    sendUserName: myName
                };

                stompClient.send("/pub/chat/message/" + currentRoomNo, {}, JSON.stringify(messageData));
                $(this).val('');
                isSubmitting = false;
            }
        }
    });

    function appendMessage(msg) {
        let chatBody = $('.chat-body');
        chatBody.find('.system-message').remove();
        let senderId = String(msg.sendUser ? msg.sendUser : '').trim();
        let senderName = String(msg.sendUserName ? msg.sendUserName : '').trim();
        
        let isMy = (senderId === myUserNo || senderName === myName);
        if (isMy && !senderName) { senderName = myName; }
        let avatarChar = senderName ? senderName.charAt(0) : '?';

        let timeStr = msg.sendDate ? msg.sendDate : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        let rawContent = msg.content ? msg.content : '';
        let contentHtml = '';

        if (rawContent.startsWith('[파일] ')) {
            let fileData = rawContent.substring(5);
            let parts = fileData.split('|');
            let originalName = parts[0];
            let savedName = parts[1];

            if (savedName) {
                contentHtml = `<a href="/chat/downloadFile?fileName=${encodeURIComponent(savedName)}" class="text-blue-600 underline hover:text-blue-800" download>📎 [파일] ${escapeHtml(originalName)}</a>`;
            } else {
                contentHtml = escapeHtml(rawContent);
            }
        } else {
            contentHtml = escapeHtml(rawContent);
        }

        chatBody.append(`
            <div class="message-row ${isMy ? 'my-message' : ''}">
                <div class="msg-avatar">${avatarChar}</div>
                <div class="message-wrapper">
                    <div class="message-sender">${escapeHtml(senderName)}</div>
                    <div class="message-content-group">
                        <div class="message-bubble">${contentHtml}</div>
                        <div class="message-time">${timeStr}</div>
                    </div>
                </div>
            </div>
        `);

        chatBody.scrollTop(chatBody[0].scrollHeight);
    }
    
    $('#searchKeyword').on('input', function() {
        const keyword = $(this).val().trim();
        let dropdown = $('#searchDropdown');

        if (keyword === '') { dropdown.hide().empty(); return; }

        $.get('/search', { keyword: keyword }, function(data) {
            dropdown.empty();
            if (!data || data.length === 0) {
                dropdown.html('<div style="padding: 12px; text-align: center; color: #888; font-size: 13px;">검색 결과가 없습니다.</div>');
                dropdown.show();
                return;
            }

            data.forEach(room => {
                let roomName = room.chatRoomName ? room.chatRoomName : '이름 없음';
                dropdown.append(`
                    <div class="search-result-item" onclick="location.href='/chatting?chatRoomNo=${room.chatRoomNo}'" 
                         style="padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #f1f3f5; font-size: 13px; color: #333;"
                         onmouseover="this.style.backgroundColor='#f8f9fa'" 
                         onmouseout="this.style.backgroundColor='white'">
                        💬 ${escapeHtml(roomName)}
                    </div>
                `);
            });
            dropdown.show();
        });
    });

    $(document).click(function(e) {
        if (!$(e.target).closest('#searchKeyword, #searchDropdown').length) {
            $('#searchDropdown').hide();
        }
    });

    function fetchMessages() {
        if (!currentRoomNo) return;
        $.get('/chat/messages', { chatRoomNo: currentRoomNo }, function(data) {
            let chatBody = $('.chat-body');
            let isAtBottom = (chatBody[0].scrollHeight - chatBody.scrollTop() <= chatBody.outerHeight() + 50);

            chatBody.empty();

            if (!data || data.length === 0) {
                chatBody.html('<div class="system-message" style="margin: auto; color: #666; font-size: 13px; text-align: center;">대화 내용이 없습니다.<br>메시지를 입력해 보세요.</div>');
                return;
            }

            data.forEach(msg => {
                let senderId = String(msg.sendUser ? msg.sendUser : '').trim();
                let senderName = String(msg.sendUserName ? msg.sendUserName : '').trim();
                
                let isMy = (senderId === myUserNo || senderName === myName);
                if (isMy && !senderName) { senderName = myName; }
                
                let avatarChar = senderName ? senderName.charAt(0) : '?';
                
                // ★ [추가] 파일 형식 파싱 및 다운로드 링크 변환 로직
                let rawContent = msg.content ? msg.content : '';
                let contentHtml = '';

                if (rawContent.startsWith('[파일] ')) {
                    let fileData = rawContent.substring(5); // '[파일] ' 제거
                    let parts = fileData.split('|');
                    let originalName = parts[0];
                    let savedName = parts[1];

                    if (savedName) {
                    	contentHtml = `<a href="/chat/downloadFile?fileName=${encodeURIComponent(savedName)}" class="text-blue-600 underline hover:text-blue-800" download>${escapeHtml(originalName)}</a>`;
                    } else {
                        contentHtml = escapeHtml(rawContent);
                    }
                } else {
                    contentHtml = escapeHtml(rawContent);
                }

                chatBody.append(`
                    <div class="message-row ${isMy ? 'my-message' : ''}">
                        <div class="msg-avatar">${avatarChar}</div>
                        <div class="message-wrapper">
                            <div class="message-sender">${escapeHtml(senderName)}</div>
                            <div class="message-content-group">
                                <div class="message-bubble">${contentHtml}</div>
                                <div class="message-time">${msg.sendDate ? msg.sendDate : ''}</div>
                            </div>
                        </div>
                    </div>
                `);
            });

            if (isAtBottom) {
                chatBody.scrollTop(chatBody[0].scrollHeight);
            }
        });
    }

    function escapeHtml(text) { return $('<div>').text(text).html(); }

    function openAddressPopupWithRoomName() {

        console.log("★★★ 새로 만들기 함수 실행됨 ★★★");

        const roomName = prompt(
            "생성할 채팅방 이름을 입력하세요:",
            "새로운 대화방"
        );

        if (roomName === null) {
            return;
        }

        const trimmedName =
            roomName.trim() === ""
                ? "새로운 대화방"
                : roomName.trim();

        console.log("입력한 방 이름:", trimmedName);

        // 주소록 팝업에서 저장할 때 사용할 채팅방 이름
        window.pendingChatRoomName = trimmedName;

        // 주소록 팝업 열기
        window.open(
            "/popupAddr",
            "addGroupPopup",
            "width=850,height=600,left=200,top=100,scrollbars=yes,resizable=yes"
        );
    }


    // ======================================================
    // 주소록 팝업에서 "저장"을 눌렀을 때만 실행
    // ======================================================

    window.addEventListener('message', function(event) {

        // 같은 사이트에서 온 메시지만 허용
        if (event.origin !== window.location.origin) {
            return;
        }

        // 채팅방 생성 메시지가 아니면 무시
        if (!event.data || event.data.type !== 'CHAT_ROOM_CREATE') {
            return;
        }

        const selectedUserNos = event.data.selectedUserNos || [];

        console.log("★★★ 주소록 저장 완료 ★★★");
        console.log("채팅방 이름:", window.pendingChatRoomName);
        console.log("선택된 사용자:", selectedUserNos);


        // 채팅방 생성
        $.ajax({

            url: '/chat/create',

            type: 'POST',

            data: {
                chatRoomName: window.pendingChatRoomName,
                userNos: selectedUserNos
            },

            success: function(response) {

                if (response === 'SUCCESS') {

                    location.reload();

                } else {

                    alert('채팅방 생성에 실패했습니다.');

                }
            },

            error: function() {

                alert('채팅방 생성 중 오류가 발생했습니다.');

            }

        });

    });

    function refreshChatRoomList() {
        $.get('/chat/roomList', function(roomList) {
            const roomListArea = $('.room-list');
            roomListArea.empty();

            roomList.forEach(function(room) {
                const activeClass = (room.chatRoomNo == currentRoomNo) ? 'active' : '';
                const avatar = room.chatRoomName ? room.chatRoomName.charAt(0) : '?';

                roomListArea.append(`
                    <div class="room-item ${activeClass}" onclick="location.href='/chatting?chatRoomNo=${room.chatRoomNo}'">
                        <div class="room-avatar">${escapeHtml(avatar)}</div>
                        <div class="room-info">
                            <div class="room-info-top">
                                <span class="room-name">${escapeHtml(room.chatRoomName)}</span>
                                <span class="room-time">${room.lastTime ? room.lastTime : ''}</span>
                            </div>
                            <div class="room-preview">${room.lastMessage ? escapeHtml(room.lastMessage) : ''}</div>
                        </div>
                    </div>
                `);
            });
        });
    }
    
    </script>
