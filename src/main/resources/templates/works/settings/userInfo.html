<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>환경설정</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .settings-wrapper {
            display: flex;
            flex: 1;
            margin-top: 0px;
        }

        .settings-content {
            flex: 1;
            padding: 40px;
            background-color: #ffffff;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            max-width: 900px;
            color: #333333;
            margin-bottom: 12px;
        }

        .setting-card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            margin-bottom: 24px;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .setting-card:hover {
            border-color: #b0b0b0;
        }

        .setting-info h3 {
            font-size: 14px;
            font-weight: 600;
            color: #222222;
            margin-bottom: 4px;
        }

        .setting-info p {
            font-size: 12px;
            color: #888888;
        }

        .arrow-icon {
            color: #666666;
            font-size: 16px;
        }

        /* 공통 모달 스타일 */
        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.35);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-box {
            width: 380px;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
        }

        .modal-box h3 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #222;
        }

        .modal-box input[type="password"],
        .modal-box input[type="text"] {
            width: 100%;
            height: 44px;
            margin-bottom: 5px;
            padding: 0 14px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-box input:focus {
            outline: none;
            border-color: #1f7ef2;
            box-shadow: 0 0 0 3px rgba(31,126,242,.15);
        }

        .modal-btn {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .modal-btn button {
            min-width: 90px;
            height: 40px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s ease;
        }

        .cancelBtn {
            background: #ffffff;
            color: #555555;
            border: 1px solid #d9d9d9;
        }

        .cancelBtn:hover {
            background: #f5f5f5;
            border-color: #c5c5c5;
        }

        .okBtn {
            background: #1f7ef2;
            color: #ffffff;
            border: 1px solid #1f7ef2;
        }

        .okBtn:hover {
            background: #1868c7;
            border-color: #1868c7;
        }
    </style>
</head>
<body>

    <!-- 1. 공통 헤더 조각 호출 -->
<div th:replace="~{fragments/dashboardHeader :: user-header}"></div>

    <div class="settings-wrapper">
        
        <!-- 2. 사이드바 조각 호출 -->
        <div th:replace="~{fragments/settingSidebar :: settingSidebar}"></div>

        <!-- 3. 우측 콘텐츠 영역 -->
        <div class="settings-content">
            <div class="section-title">프로필</div>
            <a href="#" class="setting-card" id="confirmBtn">
                <div class="setting-info">
                    <h3>개인정보수정</h3>
                    <p>개인정보를 확인 또는 수정합니다.</p>
                </div>
                <div class="arrow-icon">&gt;</div>
            </a>

            <div class="section-title" style="margin-top: 40px;">상태</div>
            <a href="/statusSetting" class="setting-card" id="statusBtn" onclick="location.href='/statusSetting'; return false;">
                <div class="setting-info">
                    <h3>상태 설정</h3>
                    <p>상태 설정을 하면 상대방이 나의 상태를 프로필에서 미리 확인할 수 있습니다.</p>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;" >
                    <span style="font-size: 13px; color: #1f7ef2;" id="statusText">설정 안 함</span>
                    <span class="arrow-icon">&gt;</span>
                </div>
            </a>
        </div>
    </div>

    <!-- 비밀번호 재확인 모달 -->
    <div id="passwordModal" class="modal">
        <div class="modal-box">
            <h3>비밀번호 재확인</h3>
            <input type="text" th:value="${userId}" readonly>
            <input type="password" id="password" placeholder="비밀번호">
            <div class="modal-btn">
                <button type="button" class="cancelBtn">취소</button>
                <button type="button" id="okBtn" class="okBtn">확인</button>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
// 1. [개인정보수정] 카드 클릭 시 서버에서 아이디를 가져와 모달 열기
document.getElementById("confirmBtn").addEventListener("click", function(e) {
    e.preventDefault();

    axios.get("/userInfoData")
        .then(function(res) {
            document.querySelector("#passwordModal input[type='text']").value = res.data;
            document.getElementById("passwordModal").style.display = "flex";
        })
        .catch(function(err) {
            if (err.response && err.response.status === 401) {
                alert("로그인이 만료되었습니다. 다시 로그인해 주세요.");
                location.href = "/login";
            } else {
                console.log(err);
            }
        });
});

// 2. 취소 버튼 클릭 시 모달 닫기 및 비밀번호 초기화
document.querySelector(".cancelBtn").addEventListener("click", function() {
    document.getElementById("passwordModal").style.display = "none";
    document.getElementById("password").value = "";
});

// 3. 확인 버튼 클릭 시 비밀번호 검증
document.getElementById("okBtn").addEventListener("click", function() {
    let passwordVal = document.getElementById("password").value;

    if (!passwordVal) {
        alert("비밀번호를 입력해주세요.");
        return;
    }

    let params = new URLSearchParams();
    params.append("password", passwordVal);

    axios.post("/verifyPassword", params)
    .then(function(res) {
        if (res.data === true) {
            location.href = "/profileChg";
        } else {
            alert("비밀번호가 일치하지 않습니다.");
            document.getElementById("password").value = "";
            document.getElementById("password").focus();
        }
    })
    .catch(function(err) {
        console.log(err);
        alert("비밀번호 검증 중 오류가 발생했습니다.");
    });
});
</script>
<script th:inline="javascript">
    /*<![CDATA[*/
    let msg = /*[[${message}]]*/ null;
    if (msg) {
        alert(msg);
    }
    /*]]>*/
</script>
</body>
</html>
