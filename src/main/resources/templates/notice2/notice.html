<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>공지사항 - WORKS</title>
<link rel="stylesheet" th:href="@{/common/css/works.css}" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- ===== Header ===== -->
<div th:replace="~{ fragments/dashboardHeader :: user-header }"></div>

<!-- ===== 주요 기능 ===== -->

<main class="notice-container">
  <h1 class="page-title">공지사항</h1>
  <div class="notice-detail">
	<div class="detail-title" th:text="${notice.noticeTitle}"></div>
	<div class="detail-date" th:text="${#temporals.format(notice.createdDate, 'yyyy-MM-dd')}"></div>
	<hr class="divider">
	<div class="detail-body" th:utext="${notice.content}"></div>
	<hr class="divider-bottom">
	<a th:href="@{/user/notices2}" class="back-link">← 목록으로</a>
  </div>
</main>

<!-- footer -->
</body>
</html>
