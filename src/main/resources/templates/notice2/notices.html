<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>공지사항 - WORKS</title>
<link rel="stylesheet" th:href="@{/common/css/works.css}" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<!-- ===== Header ===== -->
<div th:replace="~{ fragments/dashboardHeader :: user-header }"></div>

<!-- ===== 주요 기능 ===== -->

<main class="notice-container">
  <h1 class="page-title">공지사항</h1>

  <div class="notice-list">
    <div class="notice-item" th:each="notice : ${notices}">
      <a class="row" th:href="@{/notice2/notice(noticeNo=${notice.noticeNo})}">
        <span th:text="${notice.noticeTitle}">공지 제목</span>
      </a>
    </div>
  </div>
</main>

<!-- footer -->
</body>
</html>
