<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<style type="text/css">
.detail-container {
    padding: 10px 4px;
}
.detail-item {
    margin-bottom: 22px;
}
.detail-item label {
    display: block;
    font-size: 12px;
    color: #718096;
    font-weight: 600;
    margin-bottom: 6px;
}
.detail-item .value {
    font-size: 14px;
    color: #1a1d20;
    word-break: break-all;
    line-height: 1.5;
}
.detail-item .sub-email {
    color: #8a94a6;
    font-size: 13px;
    margin-left: 4px;
}
</style>
</head>
<body>

<div class="detail-container">
    
    <div class="detail-item">
        <label>시각</label>
        <div class="value" th:text="${logDetail.time}">
            2026-07-16 T15:51:44+09:00
        </div>
    </div>

    <div class="detail-item">
        <label>요청 할 일 리스트</label>
        <div class="value" th:text="${logDetail.targetList}">
            프로젝트 A 할일 리스트
        </div>
    </div>

    <div class="detail-item">
        <label>과업</label>
        <div class="value" th:text="${logDetail.task}">
            할 일 미완료 변경
        </div>
    </div>

    <div class="detail-item">
        <label>사용자</label>
        <div class="value">
            <span th:text="${logDetail.userName}"></span>
            <span class="sub-email" th:text="'(' + ${logDetail.userEmail} + ')'">
            </span>
        </div>
    </div>

    <div class="detail-item">
        <label>요청자</label>
        <div class="value" th:text="${logDetail.requester}">
            홍길동
        </div>
    </div>

    <div class="detail-item">
        <label>할 일 제목</label>
        <div class="value" th:text="${logDetail.title}">
            요청 할 일 테스트
        </div>
    </div>

    <div class="detail-item">
        <label>상세 내용</label>
        <div class="value" th:text="${logDetail.content}">
            요청 할 일 상태를 미완료로 변경함
        </div>
    </div>

</div>

</body>
</html>
