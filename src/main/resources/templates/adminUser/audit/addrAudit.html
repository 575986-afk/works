<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>감사 - 주소록 로그</title>

<!-- Bootstrap CSS & JS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- FontAwesome 아이콘 CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- axios CDN -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<!-- jQuery CDN -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<!-- jQuery UI Datepicker -->
<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<link rel="stylesheet" th:href="@{/css/common.css}">
<style type="text/css">
* {
    box-sizing: border-box;
}
body {
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "맑은 고딕", sans-serif;
    margin: 0;
    color: #333333;
}
#wrap {
    width: 100%;
    margin: 0;
}
#container {
    display: flex;
    min-height: calc(100vh - 56px);
}

/* 메인 영역 */
#main {
    flex: 1;
    background: #ffffff;
}
.pageContainer {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 40px;
}

.breadcrumb {
    font-size: 13px;
    color: #8c939d;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.warning-text {
    font-size: 12px;
    color: #718096;
    display: flex;
    align-items: center;
    gap: 4px;
}

.pageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}
.pageTitle h2 {
    font-size: 24px;
    font-weight: 700;
    color: #111827;
    margin: 0;
}
.download-btn {
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    color: #374151;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
}
.download-btn:hover {
    background: #f9fafb;
    border-color: #9ca3af;
}

/* 카드 컨테이너 */
.tableCard {
    width: 100%;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    background: #ffffff;
}

/* 기본 필터 바 */
.filterHeaderBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background-color: #ffffff;
    border-bottom: 1px solid #e5e7eb;
}

.basicSearchBox {
    display: flex;
    align-items: center;
    gap: 12px;
}

.filter-label {
    font-size: 13px;
    color: #4b5563;
    font-weight: 500;
}

/* 공통 입력창 및 드롭다운 스타일 */
.input-box {
    height: 38px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 13px;
    color: #374151;
    outline: none;
    background-color: #ffffff;
}
.input-box:focus {
    border-color: #2563eb;
}

select.input-box {
    cursor: pointer;
    appearance: auto;
}

.date-range-box {
    display: flex;
    align-items: center;
    gap: 8px;
}

.date-input {
    width: 140px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
}

.btn-basic-search {
    height: 38px;
    padding: 0 16px;
    background: #0066ff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
}
.btn-basic-search:hover {
    background: #0052cc;
}

/* 상세 버튼 스타일 */
.detail-toggle-btn {
    background: transparent;
    border: none;
    font-size: 13px;
    color: #374151;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}
.detail-toggle-btn:hover {
    color: #111827;
}

/* 상세 검색 펼침 영역 */
.detailSearchPanel {
    display: none;
    background-color: #ffffff;
    border-bottom: 1px solid #e5e7eb;
}

.detailPanelHeader {
    display: flex;
    justify-content: flex-end;
    padding: 12px 20px 0 20px;
}

.detailPanelBody {
    padding: 12px 24px 20px 24px;
}

/* 2열 그리드 배치 (4개 항목) */
.detailGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 32px;
    margin-bottom: 20px;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.filter-group label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 500;
}

.filter-group .input-box {
    width: 100%;
}

/* 하단 버튼 그룹 */
.detail-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.btn-close-panel {
    height: 36px;
    padding: 0 20px;
    background: #ffffff;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 13px;
    color: #374151;
    cursor: pointer;
}
.btn-close-panel:hover {
    background: #f9fafb;
}

.btn-search-submit {
    height: 36px;
    padding: 0 22px;
    background: #0066ff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
}
.btn-search-submit:hover {
    background: #0052cc;
}

/* 로그 테이블 */
.logTable {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
}
.logTable th {
    color: #6b7280;
    font-weight: 600;
    padding: 12px 20px;
    border-bottom: 1px solid #e5e7eb;
    background-color: #f9fafb;
    white-space: nowrap;
}
.logTable td {
    padding: 14px 20px;
    border-bottom: 1px solid #f3f4f6;
    color: #1f2937;
    vertical-align: middle;
    line-height: 1.4;
}
.logTable tbody tr:last-child td {
    border-bottom: none;
}

.sub-info {
    display: block;
    color: #9ca3af;
    font-size: 12px;
    margin-top: 2px;
}

/* jQuery UI Datepicker */
.ui-datepicker {
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid #d1d5db;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    padding: 8px;
}
.ui-datepicker-header {
    background: #ffffff !important;
    border: none !important;
    font-weight: bold;
}
.ui-state-active, .ui-widget-content .ui-state-active {
    background: #0066ff !important;
    color: #ffffff !important;
    border-color: #0066ff !important;
    border-radius: 4px;
}
</style>

<script type="text/javascript">
$(function(){
    // 사이드바 메뉴 토글
    $(".sidebarMenu").click(function(){
        $(this).next(".submenu").slideToggle(200);
        $(this).find(".arrow").toggleClass("rotate");
    });

    // Datepicker 설정
    $.datepicker.setDefaults({
        dateFormat: 'yy. mm. dd',
        prevText: '이전 달',
        nextText: '다음 달',
        monthNames: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
        monthNamesShort: ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'],
        dayNames: ['일', '월', '화', '수', '목', '금', '토'],
        dayNamesShort: ['일', '월', '화', '수', '목', '금', '토'],
        dayNamesMin: ['일', '월', '화', '수', '목', '금', '토'],
        showMonthAfterYear: true,
        yearSuffix: '년'
    });

    // 날짜 입력창 바인딩 & 실시간 동기화
    $(".date-input").datepicker({
        onSelect: function(dateText) {
            const id = $(this).attr("id");
            if (id === "basicStartDate") $("#detailStartDate").val(dateText);
            else if (id === "detailStartDate") $("#basicStartDate").val(dateText);
            else if (id === "basicEndDate") $("#detailEndDate").val(dateText);
            else if (id === "detailEndDate") $("#basicEndDate").val(dateText);
        }
    });

    // 상세 패널 전환 토글 로직
    $("#openDetailBtn").click(function(){
        $("#basicFilterHeaderBar").hide();
        $("#detailSearchPanel").slideDown(200);
    });

    $("#closeDetailBtn, #closePanelBtn").click(function(){
        $("#detailSearchPanel").slideUp(200, function(){
            $("#basicFilterHeaderBar").show();
        });
    });

    // 폼 제출 전 날짜 데이터 동기화
    $("#searchForm").submit(function(){
        if ($("#detailSearchPanel").is(":visible")) {
            $("#basicStartDate").val($("#detailStartDate").val());
            $("#basicEndDate").val($("#detailEndDate").val());
        }
    });

    // 다운로드 버튼 클릭
    $("#downloadBtn").click(function(){
        const startDate = $("#basicStartDate").val();
        const endDate = $("#basicEndDate").val();
        const task = $("#task").val();
        const userName = $("#userName").val();
        const target = $("#target").val();

        $.ajax({
            url: '/adminUser/audit/downloadAddrLog',
            type: 'GET',
            data: {
                startDate: startDate,
                endDate: endDate,
                task: task,
                userName: userName,
                target: target
            },
            success: function(htmlContent) {
                $("#downloadModalBody").html(htmlContent);
                const downloadModal = new bootstrap.Modal(document.getElementById('downloadModal'));
                downloadModal.show();
            },
            error: function() {
                alert('다운로드 폼을 불러오는데 실패했습니다.');
            }
        });
    });

    // 모달 내 확인 버튼 클릭
    $(document).on("click", "#btnConfirmDownload", function(){
        const $modalForm = $("#downloadModalBody").find("form");
        if ($modalForm.length > 0) {
            $modalForm.submit();
        }
        const modalEl = document.getElementById('downloadModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        if (modal) modal.hide();
    });
});
</script>
</head>
<body>

<!-- 헤더 -->
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div id="container">
    <!-- 사이드바 -->
    <div th:replace="~{fragments/sidebar :: sidebarFragment}"></div>
    
    <!-- 메인 영역 -->
    <div id="main">
        <div class="pageContainer">
            <div class="breadcrumb">
                <div>메인 &gt; 감사 &gt; 주소록</div>
                <span class="warning-text">
                    <i class="fa-solid fa-circle-info"></i> 업무 외 사용을 금지. 이용 기록이 저장되고 있습니다.
                </span>
            </div>

            <div class="pageHeader">
                <div class="pageTitle">
                    <h2>주소록</h2>
                </div>
                <div class="headerRightActions">
                    <button type="button" id="downloadBtn" class="download-btn">다운로드</button>
                </div>
            </div>

            <div class="tableCard">
                <form id="searchForm" th:action="@{/adminUser/audit/addrAudit}" method="get">
                    
                    <div id="basicFilterHeaderBar" class="filterHeaderBar">
                        <div class="basicSearchBox">
                            <span class="filter-label">기간</span>
                            <div class="date-range-box">
                                <input type="text" id="basicStartDate" name="startDate" class="input-box date-input" th:value="${startDate}" autocomplete="off" readonly>
                                <span>-</span>
                                <input type="text" id="basicEndDate" name="endDate" class="input-box date-input" th:value="${endDate}" autocomplete="off" readonly>
                            </div>
                            <button type="submit" class="btn-basic-search">검색</button>
                        </div>
                        <button type="button" id="openDetailBtn" class="detail-toggle-btn">
                            상세 <i class="fa-solid fa-caret-down"></i>
                        </button>
                    </div>

                    <div id="detailSearchPanel" class="detailSearchPanel">
                        <div class="detailPanelHeader">
                            <button type="button" id="closeDetailBtn" class="detail-toggle-btn">
                                상세 <i class="fa-solid fa-caret-up"></i>
                            </button>
                        </div>
                        <div class="detailPanelBody">
                            <div class="detailGrid">
                                <div class="filter-group">
                                    <label>기간</label>
                                    <div class="date-range-box">
                                        <input type="text" id="detailStartDate" class="input-box date-input" th:value="${startDate}" autocomplete="off" readonly>
                                        <span>-</span>
                                        <input type="text" id="detailEndDate" class="input-box date-input" th:value="${endDate}" autocomplete="off" readonly>
                                    </div>
                                </div>
                                <div class="filter-group">
                                    <label>과업</label>
                                    <select id="task" name="task" class="input-box">
                                        <option value="" th:selected="${task == null || task == ''}">전체</option>
                                        <option value="주소록 등록/수정" th:selected="${task == '주소록 등록/수정'}">주소록 등록/수정</option>
                                        <option value="주소록 삭제" th:selected="${task == '주소록 삭제'}">주소록 삭제</option>
                                        <option value="구성원 정보 조회" th:selected="${task == '구성원 정보 조회'}">구성원 정보 조회</option>
                                        <option value="구성원 정보 수정" th:selected="${task == '구성원 정보 수정'}">구성원 정보 수정</option>
                                        <option value="조직 수정" th:selected="${task == '조직 수정'}">조직 수정</option>
                                        <option value="그룹 조회" th:selected="${task == '그룹 조회'}">그룹 조회</option>
                                        <option value="그룹 등록" th:selected="${task == '그룹 등록'}">그룹 등록</option>
                                        <option value="그룹 수정" th:selected="${task == '그룹 수정'}">그룹 수정</option>
                                        <option value="그룹 삭제" th:selected="${task == '그룹 삭제'}">그룹 삭제</option>
                                    </select>
                                </div>
                                <div class="filter-group">
                                    <label>사용자</label>
                                    <input type="text" id="userName" name="userName" class="input-box" th:value="${userName}">
                                </div>
                                <div class="filter-group">
                                    <label>대상</label>
                                    <input type="text" id="target" name="target" class="input-box" th:value="${target}">
                                </div>
                            </div>
                            <div class="detail-actions">
                                <button type="button" id="closePanelBtn" class="btn-close-panel">닫기</button>
                                <button type="submit" class="btn-search-submit">검색</button>
                            </div>
                        </div>
                    </div>

                </form>

                <table class="logTable">
                    <thead>
                        <tr>
                            <th style="width: 25%;">대상</th>
                            <th style="width: 25%;">과업</th>
                            <th style="width: 25%;">작업자</th>
                            <th style="width: 25%;">날짜</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(logList)}">
                            <td colspan="4" style="text-align: center; color: #8c939d; padding: 24px 0;">
                                조회된 주소록 로그가 없습니다.
                            </td>
                        </tr>
                        <tr th:each="log : ${logList}">
                            <td>
                                <span style="font-weight: 600;" th:text="${log.target}">홍길동</span>
                                <span class="sub-info" th:text="${log.targetEmail}">hong@example.com</span>
                            </td>
                            <td th:text="${log.task}">주소록 등록/수정</td>
                            <td>
                                <span th:text="${log.userName}">윤진영</span>
                                <span class="sub-info" th:text="${log.userEmail}">yjy3838@practice-6.by-works.net</span>
                            </td>
                            <td>
                                <span th:text="${log.date}">2026-07-16</span>
                                <span class="sub-info" th:text="${log.time}">T16:13:36+09:00</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- 다운로드 요청 모달 -->
<div class="modal fade" id="downloadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content p-2">
            <div class="modal-header border-0 pb-1">
                <h5 class="modal-title fw-bold fs-6">다운로드 요청</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-2" id="downloadModalBody">
            </div>
            <div class="modal-footer border-0 pt-1">
                <button type="button" class="btn btn-light btn-sm px-3" data-bs-dismiss="modal" style="font-size: 13px;">취소</button>
                <button type="button" id="btnConfirmDownload" class="btn btn-primary btn-sm px-3" style="font-size: 13px;">확인</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
