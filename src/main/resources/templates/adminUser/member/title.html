<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>직책/직급</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome 아이콘 CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- axios CDN -->
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<link rel="stylesheet" th:href="@{/css/common.css}">
<style type="text/css">
* { box-sizing: border-box; }
body { background: #ffffff; font-family: "맑은 고딕", sans-serif; margin: 0; }
#wrap { width: 100%; margin: 0; }
#container { display: flex; min-height: calc(100vh - 56px); }

#main { flex: 1; background: #fff; }
.pageContainer { width: 100%; max-width: 1500px; margin: 0 auto; padding: 35px 20px; }
.breadcrumb { font-size: 12px; color: #9ca3af; margin-bottom: 15px; }
.pageTitle h2 { font-size: 24px; font-weight: 700; color: #1f2937; margin: 0 0 30px 0; }
.contentBox { width: 100%; }

.memberHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.memberBtnArea button { margin-left: 6px; font-size: 13px; padding: 6px 16px; }

.tabHeader { display: flex; border-bottom: 1px solid #e5e7eb; margin-bottom: 20px; }
.tabLeft { display: flex; }
.divisionTab { padding: 12px 25px; font-size: 14px; cursor: pointer; color: #666; }
.divisionTab.active { color: #0d6efd; font-weight: bold; border-bottom: 2px solid #0d6efd; }

.memberWrap { border: 1px solid #e5e7eb; border-radius: 4px; overflow: hidden; background: #fff; }
table { width: 100%; border-collapse: collapse; }
th { height: 40px; background: #fafafa; font-size: 13px; color: #666; border-bottom: 1px solid #e5e7eb; text-align: center; }
td { height: 52px; border-top: 1px solid #f1f1f1; font-size: 13px; text-align: center; vertical-align: middle; }

/* 수정 모드 UI 스타일 */
.drag-handle { cursor: grab; color: #aaa; margin-right: 10px; font-size: 13px; }
.drag-handle:active { cursor: grabbing; }

.input-clear-wrap { position: relative; width: 70%; max-width: 320px; margin: 0 auto; }
.input-clear-wrap input { width: 100%; height: 36px; padding: 0 30px 0 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; outline: none; }
.input-clear-wrap input:focus { border-color: #3b82f6; }
.input-clear-wrap .btn-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none; background: none; color: #f87171; font-size: 13px; cursor: pointer; display: none; }
.input-clear-wrap input:not(:placeholder-shown) + .btn-clear { display: block; }

.btn-del { color: #dc2626; border: 1px solid #fca5a5; background: #fff; padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn-del:hover { background: #fee2e2; }

.add-row-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; background: #fff; border-top: 1px solid #e5e7eb; color: #2563eb; font-size: 13px; font-weight: 600; cursor: pointer; }
.add-row-btn:hover { background: #f8fafc; }

tr.dragging { opacity: 0.4; background: #f1f5f9; }
</style>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script type="text/javascript">
let currentType = "position";
let isEditMode = false;
let originalData = [];

function getItemId(item) {
    if (!item) return null;
    return (currentType === "position") ? item.positionNo : item.rankNo;
}

function getItemName(item) {
    if (!item) return "";
    return (currentType === "position") ? item.positionName : item.rankName;
}

$(function() {
	// 사이드바 토글 동작
    $(".sidebarMenu").click(function(){
        $(this).next(".submenu").slideToggle(200);
        $(this).find(".arrow").toggleClass("rotate");
    });
	
    loadList();

    $(".divisionTab").click(function(){
        if(isEditMode) {
            if(!confirm("수정 중인 내용이 파기됩니다. 탭을 이동하시겠습니까?")) return;
            exitEditMode();
        }
        $(".divisionTab").removeClass("active");
        $(this).addClass("active");

        currentType = $(this).data("type");
        loadList();
    });

    $("#editBtn").click(function() {
        enterEditMode();
    });

    $("#cancelBtn").click(function() {
        exitEditMode();
        renderTable(originalData);
    });

    $("#saveBtn").click(function() {
        saveChanges();
    });

    $("#addRowBtn").click(function() {
        addNewRow();
    });
});

function loadList() {
    let url = (currentType === "position") ? "/adminUser/member/position/list" : "/adminUser/member/rank/list";
    
    axios.get(url).then(function(res) {
        originalData = res.data;
        renderTable(originalData);
    });
}

function enterEditMode() {
    isEditMode = true;
    $("#editBtn").hide();
    $("#cancelBtn, #saveBtn").show();
    renderTable(originalData);
}

function exitEditMode() {
    isEditMode = false;
    $("#cancelBtn, #saveBtn").hide();
    $("#editBtn").show();
}

function renderTable(data) {
    let titleText = (currentType === "position") ? "직책" : "직급";
    $("#typeHeaderTitle").text(titleText);

    if (isEditMode) {
        $("#colManage").show();
        $("#addRowBtn").show().find("span").text(titleText + " 추가");
    } else {
        $("#colManage").hide();
        $("#addRowBtn").hide();
    }

    let $tbody = $("#titleTableBody").empty();

    $.each(data, function(idx, item) {
        let id = getItemId(item);
        let name = getItemName(item);

        let $tr = $("<tr>").addClass("userRow").attr("data-id", id);

        if (isEditMode) {
            $tr.attr("draggable", "true");
            bindDragEvents($tr);

            let tdSeq = `<td><i class="fa-solid fa-grip-vertical drag-handle"></i><span class="seq-num">${idx + 1}</span></td>`;
            let tdName = `<td>
                <div class="input-clear-wrap">
                    <input type="text" class="name-input" value="${name}" placeholder="${titleText}">
                    <button type="button" class="btn-clear" onclick="clearInput(this)"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </td>`;
            let tdManage = `<td><button type="button" class="btn-del" onclick="deleteRow(this)">삭제</button></td>`;

            $tr.append(tdSeq).append(tdName).append(tdManage);
        } else {
            $tr.append(`<td>${idx + 1}</td>`).append(`<td>${name}</td>`);
        }

        $tbody.append($tr);
    });
}

function addNewRow() {
    let titleText = (currentType === "position") ? "직책" : "직급";
    let nextSeq = $("#titleTableBody tr").length + 1;

    let $tr = $("<tr>").addClass("userRow new-row").attr("draggable", "true");
    bindDragEvents($tr);

    let tdSeq = `<td><i class="fa-solid fa-grip-vertical drag-handle"></i><span class="seq-num">${nextSeq}</span></td>`;
    let tdName = `<td>
        <div class="input-clear-wrap">
            <input type="text" class="name-input" value="" placeholder="${titleText}">
            <button type="button" class="btn-clear" onclick="clearInput(this)"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </td>`;
    let tdManage = `<td><button type="button" class="btn-del" onclick="deleteRow(this)">삭제</button></td>`;

    $tr.append(tdSeq).append(tdName).append(tdManage);
    $("#titleTableBody").append($tr);
    $tr.find(".name-input").focus();
}

function deleteRow(btn) {
    $(btn).closest("tr").remove();
    updateSequenceNumbers();
}

function clearInput(btn) {
    let $input = $(btn).siblings("input");
    $input.val("").focus();
}

function updateSequenceNumbers() {
    $("#titleTableBody tr").each(function(index) {
        $(this).find(".seq-num").text(index + 1);
    });
}

async function saveChanges() {
    try {
        let saveList = [];
        $("#titleTableBody tr").each(function(index) {
            let $tr = $(this);
            let id = $tr.attr("data-id");
            let name = $tr.find(".name-input").val().trim();

            if (!name) {
                return;
            }

            saveList.push({
                no: id || null,
                name: name,
                priority: index + 1
            });
        });
        let saveUrl =
            (currentType === "position")
                ? "/adminUser/member/position/save"
                : "/adminUser/member/rank/save";

        const response = await axios.post(saveUrl, saveList);

        if (response.data === "success") {
            alert("저장되었습니다.");
        } else {
            alert(response.data);
        }

        exitEditMode();
        loadList();
    } catch (error) {
        console.error("저장 오류:", error);
        if (error.response) {
            console.error("status:", error.response.status);
            console.error("data:", error.response.data);
        }
        alert("저장 중 오류가 발생했습니다.");
    }
}

let draggedRow = null;

function bindDragEvents($tr) {
    $tr.on("dragstart", function() {
        draggedRow = this;
        $(this).addClass("dragging");
    });

    $tr.on("dragend", function() {
        $(this).removeClass("dragging");
        draggedRow = null;
        updateSequenceNumbers();
    });

    $tr.on("dragover", function(e) {
        e.preventDefault();
        let currentTarget = this;
        if (draggedRow && draggedRow !== currentTarget) {
            let children = Array.from($("#titleTableBody tr"));
            let draggedIdx = children.indexOf(draggedRow);
            let targetIdx = children.indexOf(currentTarget);

            if (draggedIdx < targetIdx) {
                $(currentTarget).after(draggedRow);
            } else {
                $(currentTarget).before(draggedRow);
            }
        }
    });
}
</script>
</head>
<body>

<div th:replace="~{fragments/adminHeader :: headerFragment}"></div>

<div id="container">
    <div th:replace="~{fragments/adminSidebar :: sidebarFragment}"></div>
    
    <div id="main">
        <div class="pageContainer">
            <div class="breadcrumb">메인 > 구성원 > 직책/직급</div>
            <div class="pageTitle">
                <h2>직책/직급</h2>
            </div>
            
            <div id="memberContent">
                <div class="contentBox">
                    <div class="memberHeader">
                        <div></div>
                        <div class="memberBtnArea">
                            <button id="editBtn" class="btn btn-info">수정</button>
                            <button id="cancelBtn" class="btn btn-outline-secondary" style="display: none;">취소</button>
                            <button id="saveBtn" class="btn btn-primary" style="display: none;">저장</button>
                        </div>
                    </div>
                    <div class="tabHeader">
                        <div class="tabLeft">
                            <div class="divisionTab active" data-type="position">직책</div>
                            <div class="divisionTab" data-type="rank">직급</div>
                        </div>
                    </div>

                    <div class="memberWrap">
                        <div class="memberList">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 100px;">순서</th>
                                        <th id="typeHeaderTitle">직책</th>
                                        <th id="colManage" style="width: 100px; display: none;">관리</th>
                                    </tr>
                                </thead>
                                <tbody id="titleTableBody">
                                </tbody>
                            </table>
                            <div id="addRowBtn" class="add-row-btn" style="display: none;">
                                <i class="fa-solid fa-plus me-1"></i> <span>직책 추가</span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
