<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>공지사항 관리</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<header th:replace="~{fragments/adminLayout :: adminHeader}"></header>

<div class="flex">
<aside th:replace="~{fragments/adminLayout :: adminSidebar('notice')}"></aside>

<main class="flex-1 p-6 space-y-4">
  <div th:if="${message}" class="text-sm text-blue-600 bg-blue-50 border border-blue-100 rounded px-3 py-2" th:text="${message}"></div>

  <div class="flex items-center justify-between">
    <h1 class="text-lg font-bold">공지사항 관리</h1>
    <div class="flex space-x-2">
      <form th:action="@{/admin/notice}" method="get" class="flex space-x-2">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="제목 검색"
               class="border border-gray-300 rounded px-3 py-1.5 text-sm w-48">
        <button type="submit" class="px-3 py-1.5 bg-gray-100 rounded text-sm">검색</button>
      </form>
      <a th:href="@{/admin/notice/addForm}" class="px-3 py-1.5 bg-blue-500 text-white rounded text-sm">새 공지 등록</a>
    </div>
  </div>

  <div class="bg-white rounded-lg border overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs">
        <tr>
          <th class="px-4 py-2 text-left">제목</th>
          <th class="px-4 py-2 text-left">상태</th>
          <th class="px-4 py-2 text-left">등록일</th>
          <th class="px-4 py-2"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="n : ${noticeList}" class="border-t border-gray-100">
          <td class="px-4 py-2" th:text="${n.noticeTitle}"></td>
          <td class="px-4 py-2" th:text="${n.status}"></td>
          <td class="px-4 py-2" th:text="${n.createdDate}"></td>
          <td class="px-4 py-2">
            <a th:href="@{/admin/notice/modifyForm(noticeNo=${n.noticeNo})}" class="text-blue-500 text-xs">수정</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(noticeList)}">
          <td colspan="4" class="px-4 py-6 text-center text-gray-400 text-sm">등록된 공지사항이 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</div>
</body>
</html>
