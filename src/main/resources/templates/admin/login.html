<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체관리자 로그인</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f5f6f7]">
<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <h1 class="font-bold text-2xl tracking-tight text-gray-800">전체관리자</h1>
    <p class="text-sm text-gray-500 mt-1">시스템 전체 관리자 로그인</p>
  </div>
  <div class="bg-white shadow-sm border border-gray-100 rounded-lg p-8">
    <form th:action="@{/admin/login}" method="post" class="space-y-4">
      <div th:if="${errorMessage}" class="text-sm text-red-500 bg-red-50 border border-red-100 rounded px-3 py-2" th:text="${errorMessage}">에러</div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">관리자 아이디</label>
        <input type="text" name="adminId" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-blue-400 focus:border-blue-400" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">비밀번호</label>
        <input type="password" name="adminPw" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-blue-400 focus:border-blue-400" />
      </div>
      <button type="submit"
              class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded text-sm transition-colors">
        로그인
      </button>
    </form>
  </div>
</div>
</body>
</html>
