<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>1:1 문의 관리</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<header th:replace="~{fragments/adminLayout :: adminHeader}"></header>

<div class="flex">
<aside th:replace="~{fragments/adminLayout :: adminSidebar('inquiry')}"></aside>

<main class="flex-1 p-6 space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-bold">1:1 문의 관리</h1>
    <form th:action="@{/admin/inquiry}" method="get" class="flex space-x-2">
      <input type="text" name="keyword" th:value="${keyword}" placeholder="제목 검색"
             class="border border-gray-300 rounded px-3 py-1.5 text-sm w-48">
      <button type="submit" class="px-3 py-1.5 bg-gray-100 rounded text-sm">검색</button>
    </form>
  </div>

  <div class="bg-white rounded-lg border overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs">
        <tr>
          <th class="px-4 py-2 text-left">제목</th>
          <th class="px-4 py-2 text-left">상태</th>
          <th class="px-4 py-2 text-left">문의일</th>
          <th class="px-4 py-2"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="i : ${inquiryList}" class="border-t border-gray-100">
          <td class="px-4 py-2" th:text="${i.title}"></td>
          <td class="px-4 py-2" th:text="${i.status}"></td>
          <td class="px-4 py-2" th:text="${i.inquiry_date}"></td>
          <td class="px-4 py-2">
            <a th:href="@{/admin/inquiry/detail(inquiryNo=${i.inquiry_no})}" class="text-blue-500 text-xs">상세/답변</a>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(inquiryList)}">
          <td colspan="4" class="px-4 py-6 text-center text-gray-400 text-sm">접수된 문의가 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</div>
</body>
</html>
